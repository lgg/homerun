name: Agent validate flattened release workflow

on:
  push:
    branches:
      - agent/flatten-release-assets
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@latest
      - name: Validate release workflow
        run: |
          "$(go env GOPATH)/bin/actionlint" .github/workflows/release-build.yml
