name: Format runtime runner display changes

on:
  push:
    branches:
      - fix/runtime-home-runner-display-preferences

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: |
          cargo fmt --all
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Remove one-shot workflow
        run: rm .github/workflows/format-runtime-runner-display.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: apply canonical Rust formatting"
          git push origin HEAD:${GITHUB_REF_NAME}
