name: One-shot creation barrier durable commit

on:
  push:
    branches:
      - fix/shutdown-lifecycle-barrier-2026-08-28
    paths:
      - .github/workflows/one-shot-creation-barrier-commit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/shutdown-lifecycle-barrier-2026-08-28
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Keep creation admission through persistence
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/daemon/src/runner/mod.rs")
          text = path.read_text()

          old = '''        if desired && !creation_operations.starting.insert(id.clone()) {
              self.runners.write().await.remove(&id);
              let _ = std::fs::remove_dir_all(&runner.config.work_dir);
              bail!("Runner '{id}' already has a start operation in progress");
          }
          drop(creation_operations);
          if desired {
              self.desired_running.write().await.insert(id.clone());
          }

          if let Err(error) = self.save_to_disk_locked().await {
              self.runners.write().await.remove(&id);
              if desired {
                  self.desired_running.write().await.remove(&id);
              }
              let _ = std::fs::remove_dir_all(&runner.config.work_dir);
              drop(_persistence_guard);
              if desired {
                  self.finish_start_operation(&id).await;
              }
              return Err(error).context("persisting newly-created runner");
          }
          Ok(runner)
          '''
          new = '''        if desired && !creation_operations.starting.insert(id.clone()) {
              self.runners.write().await.remove(&id);
              let _ = std::fs::remove_dir_all(&runner.config.work_dir);
              bail!("Runner '{id}' already has a start operation in progress");
          }
          if desired {
              self.desired_running.write().await.insert(id.clone());
          }

          if let Err(error) = self.save_to_disk_locked().await {
              self.runners.write().await.remove(&id);
              if desired {
                  self.desired_running.write().await.remove(&id);
                  creation_operations.starting.remove(&id);
              }
              let _ = std::fs::remove_dir_all(&runner.config.work_dir);
              drop(_persistence_guard);
              drop(creation_operations);
              return Err(error).context("persisting newly-created runner");
          }

          // Keep lifecycle admission locked through the durable write. Shutdown
          // therefore cannot overtake a creation that it failed to reject.
          drop(_persistence_guard);
          drop(creation_operations);
          Ok(runner)
          '''
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one creation transaction block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
      - name: Format Rust changes
        run: cargo fmt --all
      - name: Commit patch and remove workflow
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-creation-barrier-commit.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: hold creation barrier through persistence"
          git push origin HEAD:fix/shutdown-lifecycle-barrier-2026-08-28
