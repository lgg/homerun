name: One-shot creation barrier durable commit

on:
  push:
    branches:
      - fix/shutdown-lifecycle-barrier-2026-08-28
    paths:
      - .github/workflows/one-shot-creation-barrier-commit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/shutdown-lifecycle-barrier-2026-08-28
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Keep creation admission through persistence
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/daemon/src/runner/mod.rs")
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              "        drop(creation_operations);\n        if desired {\n            self.desired_running.write().await.insert(id.clone());\n        }",
              "        if desired {\n            self.desired_running.write().await.insert(id.clone());\n        }",
              "early lifecycle unlock",
          )

          replace_once(
              "            if desired {\n                self.desired_running.write().await.remove(&id);\n            }\n            let _ = std::fs::remove_dir_all(&runner.config.work_dir);",
              "            if desired {\n                self.desired_running.write().await.remove(&id);\n                creation_operations.starting.remove(&id);\n            }\n            let _ = std::fs::remove_dir_all(&runner.config.work_dir);",
              "persistence rollback reservation",
          )

          replace_once(
              "            drop(_persistence_guard);\n            if desired {\n                self.finish_start_operation(&id).await;\n            }\n            return Err(error).context(\"persisting newly-created runner\");",
              "            drop(_persistence_guard);\n            drop(creation_operations);\n            return Err(error).context(\"persisting newly-created runner\");",
              "rollback lifecycle unlock",
          )

          replace_once(
              "        }\n        Ok(runner)\n    }\n\n    pub async fn create_batch(",
              "        }\n\n        // Keep lifecycle admission locked through the durable write. Shutdown\n        // therefore cannot overtake a creation that it failed to reject.\n        drop(_persistence_guard);\n        drop(creation_operations);\n        Ok(runner)\n    }\n\n    pub async fn create_batch(",
              "successful lifecycle unlock",
          )

          path.write_text(text)
      - name: Format Rust changes
        run: cargo fmt --all
      - name: Commit patch and remove workflow
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-creation-barrier-commit.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: hold creation barrier through persistence"
          git push origin HEAD:fix/shutdown-lifecycle-barrier-2026-08-28
