name: Full Audit CLI Mode Fix

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'audit/full-product-function-screen-audit-2026-07-25'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/full-product-function-screen-audit-2026-07-25
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Align CLI runner modes and examples
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('crates/tui/src/main.rs')
          source = main.read_text()
          source = source.replace(
              '/// Runner mode: app, service, or container',
              '/// Runner mode: app or service; create container runners in the desktop app',
          )
          main.write_text(source)

          cli = Path('crates/tui/src/cli.rs')
          source = cli.read_text()
          marker = 'async fn cmd_add(\n'
          helper = '''fn normalize_cli_mode(mode: Option<String>) -> Result<Option<String>> {\n    match mode.as_deref() {\n        None => Ok(None),\n        Some("app") => Ok(Some("app".to_string())),\n        Some("service") => Ok(Some("service".to_string())),\n        Some("container") => bail!(\n            "container runners require an image and must be created from the desktop app"\n        ),\n        Some(other) => bail!("unsupported runner mode '{other}'; use app or service"),\n    }\n}\n\n'''
          if 'fn normalize_cli_mode(' not in source:
              if marker not in source:
                  raise SystemExit('cmd_add marker missing')
              source = source.replace(marker, helper + marker, 1)
          old_add = '''async fn cmd_add(\n    client: &DaemonClient,\n    name: String,\n    repo: String,\n    count: u8,\n    labels: Option<Vec<String>>,\n    mode: Option<String>,\n) -> Result<()> {\n    if count == 0 || count > 10 {'''
          new_add = '''async fn cmd_add(\n    client: &DaemonClient,\n    name: String,\n    repo: String,\n    count: u8,\n    labels: Option<Vec<String>>,\n    mode: Option<String>,\n) -> Result<()> {\n    let mode = normalize_cli_mode(mode)?;\n    if count == 0 || count > 10 {'''
          if old_add in source:
              source = source.replace(old_add, new_add, 1)
          old_mode = '''async fn cmd_set_mode(client: &DaemonClient, selector: &str, mode: String) -> Result<()> {\n    if !matches!(mode.as_str(), "app" | "service" | "container") {\n        bail!("mode must be one of: app, service, container");\n    }\n    let runner = resolve_runner(client, selector).await?;'''
          new_mode = '''async fn cmd_set_mode(client: &DaemonClient, selector: &str, mode: String) -> Result<()> {\n    let mode = normalize_cli_mode(Some(mode))?\n        .expect("set-mode always supplies a mode");\n    let runner = resolve_runner(client, selector).await?;'''
          if old_mode in source:
              source = source.replace(old_mode, new_mode, 1)
          test_marker = '''    #[test]\n    fn test_cmd_about_succeeds() {'''
          tests = '''    #[test]\n    fn test_normalize_cli_mode_accepts_native_modes() {\n        assert_eq!(normalize_cli_mode(Some("app".into())).unwrap(), Some("app".into()));\n        assert_eq!(\n            normalize_cli_mode(Some("service".into())).unwrap(),\n            Some("service".into())\n        );\n    }\n\n    #[test]\n    fn test_normalize_cli_mode_rejects_container_without_config() {\n        let error = normalize_cli_mode(Some("container".into())).unwrap_err();\n        assert!(error.to_string().contains("desktop app"));\n    }\n\n'''
          if 'test_normalize_cli_mode_accepts_native_modes' not in source:
              if test_marker not in source:
                  raise SystemExit('test marker missing')
              source = source.replace(test_marker, tests + test_marker, 1)
          cli.write_text(source)

          readme = Path('README.md')
          source = readme.read_text()
          source = source.replace(
              'homerun --no-tui add owner/repo --name build-1\nhomerun --no-tui batch owner/repo 3 --name-prefix build',
              'homerun --no-tui add build-1 --repo owner/repo\nhomerun --no-tui add build --repo owner/repo --count 3',
          )
          source = source.replace('homerun --no-tui set-mode build-1 app-managed', 'homerun --no-tui set-mode build-1 app')
          readme.write_text(source)
          PY
          cargo fmt --all
          git diff --check
          if git diff --quiet; then
            echo 'CLI modes and examples are already aligned.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/tui/src/main.rs crates/tui/src/cli.rs README.md
          git commit -m 'fix: align CLI mode handling with daemon capabilities'
          git push origin HEAD:audit/full-product-function-screen-audit-2026-07-25
