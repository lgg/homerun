name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

# A single project-specific runner executes every HomeRun maintenance workflow.
# Keep jobs queued instead of cancelling older work when another commit arrives.
concurrency:
  group: homerun-ci-${{ github.repository }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Full quality gate
    runs-on: homerun-ci
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify preinstalled toolchain
        run: |
          set -euo pipefail
          for tool in git node npm rustc cargo; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "::error::$tool is not installed on the homerun-ci runner"
              exit 1
            }
          done
          cargo fmt --version >/dev/null 2>&1 || {
            echo "::error::rustfmt is not installed on the homerun-ci runner"
            exit 1
          }
          cargo clippy --version >/dev/null 2>&1 || {
            echo "::error::clippy is not installed on the homerun-ci runner"
            exit 1
          }
          cargo llvm-cov --version >/dev/null 2>&1 || {
            echo "::error::cargo-llvm-cov is not installed on the homerun-ci runner"
            exit 1
          }
          if command -v pre-commit >/dev/null 2>&1; then
            echo "PRE_COMMIT_COMMAND=pre-commit" >> "$GITHUB_ENV"
          elif command -v python >/dev/null 2>&1 && python -c "import pre_commit" >/dev/null 2>&1; then
            echo "PRE_COMMIT_COMMAND=python -m pre_commit" >> "$GITHUB_ENV"
          elif command -v python3 >/dev/null 2>&1 && python3 -c "import pre_commit" >/dev/null 2>&1; then
            echo "PRE_COMMIT_COMMAND=python3 -m pre_commit" >> "$GITHUB_ENV"
          else
            echo "::error::pre-commit is not installed on the homerun-ci runner"
            exit 1
          fi
          git --version
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Install locked frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Run pre-commit checks
        env:
          SKIP: no-commit-to-branch,cargo-test,cargo-clippy
        run: $PRE_COMMIT_COMMAND run --all-files --show-diff-on-failure

      - name: Run React tests with coverage
        working-directory: apps/desktop
        run: npm run test:coverage

      - name: Type check
        working-directory: apps/desktop
        run: npm exec -- tsc --noEmit

      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run daemon tests with coverage
        run: cargo llvm-cov -p homerund --all-features --lcov --output-path daemon-lcov.info

      - name: Run TUI tests with coverage
        run: cargo llvm-cov -p homerun --all-features --lcov --output-path tui-lcov.info

      - name: Merge coverage reports
        run: |
          sed 's|^SF:src/|SF:apps/desktop/src/|' apps/desktop/coverage/lcov.info > react-lcov-fixed.info
          cat daemon-lcov.info tui-lcov.info react-lcov-fixed.info > lcov.info

      - name: Coverage report
        if: always()
        continue-on-error: true
        uses: aGallea/tests-coverage-report@1.3.14
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-path: ./lcov.info
          diffcover-ref: lcov
          show-junit: false
          show-diffcover: true
          min-coverage-percentage: "80"
          fail-under-coverage-percentage: "false"

      - name: Clean Rust build artifacts
        if: always()
        run: cargo clean
