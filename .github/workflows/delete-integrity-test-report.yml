name: Delete Integrity Test Report

on:
  pull_request:
    branches: [master]
    types: [reopened]

permissions:
  contents: read

jobs:
  capture:
    if: github.event.pull_request.number == 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/delete-integrity-and-start-admission-2026-07-24
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture workspace test result
        shell: bash
        run: |
          set +e
          cargo test --workspace --all-targets > workspace-test.log 2>&1
          echo "$?" > workspace-test.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: delete-integrity-workspace-test
          path: |
            workspace-test.log
            workspace-test.status
          retention-days: 1

  report:
    needs: capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: delete-integrity-workspace-test
      - name: Print focused failure
        shell: bash
        run: |
          status=$(cat workspace-test.status)
          if [[ "$status" != "0" ]]; then
            grep -nE 'FAILED|failures:|panicked at|error\[|error: test failed|thread .* panicked' workspace-test.log || true
            tail -n 180 workspace-test.log
          else
            echo "Workspace tests passed"
          fi
          exit "$status"
