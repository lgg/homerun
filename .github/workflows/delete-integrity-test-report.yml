name: Delete Authentication Patch Diagnostic

on:
  pull_request:
    branches: [master]
    types: [reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.number == 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/delete-integrity-and-start-admission-2026-07-24
          fetch-depth: 0
      - name: Reproduce patch and formatter result
        shell: bash
        run: |
          git fetch origin master
          git show origin/master:.github/workflows/delete-integrity-final-validation.yml > /tmp/final-validation.yml
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/final-validation.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          script_lines = []
          for line in lines[start:end]:
              script_lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply.py').write_text('\n'.join(script_lines) + '\n', encoding='utf-8')
          PY
          set +e
          python /tmp/apply.py > patch.log 2>&1
          echo "$?" > patch.status
          cargo fmt --all > fmt.log 2>&1
          echo "$?" > fmt.status
          git diff > patch.diff
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: delete-auth-patch-output
          path: |
            patch.log
            patch.status
            fmt.log
            fmt.status
            patch.diff
            crates/daemon/src/runner/mod.rs
            crates/daemon/src/api/runners.rs
            crates/daemon/src/api/groups.rs
          retention-days: 1
