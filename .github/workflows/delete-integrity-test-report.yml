name: Delete Authentication Patch Diagnostic

on:
  pull_request:
    branches: [master]
    types: [reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.number == 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/delete-integrity-and-start-admission-2026-07-24
      - name: Inspect structural patch boundaries
        run: |
          python - <<'PY' > diagnostic.txt
          from pathlib import Path

          checks = {
              'manager': [
                  '    async fn delete_reserved(&self, id: &str) -> Result<()> {',
                  '\n    pub async fn update(',
                  '    #[tokio::test]\n    async fn test_full_delete_skips_remote_api_for_unconfigured_runner() {',
              ],
              'runners': [
                  'pub async fn delete_runner(',
                  '\npub async fn start_runner(',
                  '    #[tokio::test]\n    async fn test_get_runner_not_found() {',
              ],
              'groups': [
                  'pub async fn scale_group(',
                  '\npub async fn delete_group(',
                  '    // Scaling up requires authentication',
                  '\n\n    let response',
                  '    #[tokio::test]\n    async fn test_list_runners_filter_by_group_id() {',
              ],
          }
          paths = {
              'manager': Path('crates/daemon/src/runner/mod.rs'),
              'runners': Path('crates/daemon/src/api/runners.rs'),
              'groups': Path('crates/daemon/src/api/groups.rs'),
          }
          for name, needles in checks.items():
              text = paths[name].read_text(encoding='utf-8')
              print(f'[{name}] bytes={len(text)}')
              for needle in needles:
                  print(repr(needle), 'count=', text.count(needle), 'index=', text.find(needle))
          PY
          cat diagnostic.txt
      - uses: actions/upload-artifact@v4
        with:
          name: delete-auth-boundaries
          path: diagnostic.txt
          retention-days: 1
