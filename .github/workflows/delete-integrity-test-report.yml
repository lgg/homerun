name: Delete Integrity Test Diagnostic

on:
  pull_request:
    branches: [master]
    types: [reopened]

permissions:
  contents: read

jobs:
  capture:
    if: github.event.pull_request.number == 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/delete-integrity-and-start-admission-2026-07-24
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture workspace tests
        shell: bash
        run: |
          set +e
          cargo test --workspace --all-targets > workspace-test.log 2>&1
          echo "$?" > workspace-test.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: delete-integrity-final-test
          path: |
            workspace-test.log
            workspace-test.status
          retention-days: 1
