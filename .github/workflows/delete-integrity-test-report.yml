name: Delete Integrity Tauri Report

on:
  pull_request:
    branches: [master]
    types: [reopened]

permissions:
  contents: read

jobs:
  capture:
    if: github.event.pull_request.number == 12
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/delete-integrity-and-start-admission-2026-07-24
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture Linux Tauri result
        shell: bash
        run: |
          set +e
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets > tauri-check.log 2>&1
          echo "$?" > tauri-check.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: delete-integrity-tauri-check
          path: |
            tauri-check.log
            tauri-check.status
          retention-days: 1

  report:
    needs: capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: delete-integrity-tauri-check
      - name: Print focused failure
        shell: bash
        run: |
          status=$(cat tauri-check.status)
          if [[ "$status" != "0" ]]; then
            grep -nE 'error\[|error:|failed to|could not compile' tauri-check.log || true
            tail -n 200 tauri-check.log
          else
            echo "Linux Tauri check passed"
          fi
          exit "$status"
