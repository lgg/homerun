name: Agent prepare v0.8.5

on:
  push:
    branches:
      - agent/release-v0.8.5

permissions:
  contents: write

jobs:
  prepare-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-v0.8.5
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Apply v0.8.5 metadata changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          version = "0.8.5"

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise RuntimeError(f"Expected exactly one occurrence in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once("Cargo.toml", 'version = "0.8.4"', f'version = "{version}"')
          replace_once("apps/desktop/src-tauri/Cargo.toml", 'version = "0.8.4"', f'version = "{version}"')
          replace_once("apps/desktop/src-tauri/tauri.conf.json", '"version": "0.8.4"', f'"version": "{version}"')
          replace_once("apps/desktop/package.json", '"version": "0.8.4"', f'"version": "{version}"')

          package_lock = Path("apps/desktop/package-lock.json")
          package_lock_text = package_lock.read_text(encoding="utf-8")
          old = '"version": "0.8.3"'
          if package_lock_text.count(old) != 2:
              raise RuntimeError("Expected two package-lock root version entries")
          package_lock.write_text(package_lock_text.replace(old, f'"version": "{version}"', 2), encoding="utf-8")

          manifest = Path(".release-please-manifest.json")
          manifest_data = json.loads(manifest.read_text(encoding="utf-8"))
          manifest_data["."] = version
          manifest.write_text(json.dumps(manifest_data, indent=2) + "\n", encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          changelog_text = changelog.read_text(encoding="utf-8")
          marker = "---\n\n"
          section = """## [0.8.5](https://github.com/lgg/homerun/compare/v0.8.4...v0.8.5) (2026-07-18)\n\n### Features\n\n* add editable HomeRun-only display names while preserving GitHub runner names\n\n### Bug Fixes\n\n* reopen the main application window from the tray after it was closed\n* persist runner PATCH updates and support clearing display names safely\n* prepare release packaging for available GitHub-hosted runners\n\n"""
          if "## [0.8.5]" not in changelog_text:
              if marker not in changelog_text:
                  raise RuntimeError("Unable to locate changelog insertion marker")
              changelog.write_text(changelog_text.replace(marker, marker + section, 1), encoding="utf-8")

          inspection = Path(".release-inspection.txt")
          if inspection.exists():
              inspection.unlink()
          PY

      - name: Refresh lock metadata without dependency upgrades
        shell: bash
        run: |
          cargo check --workspace
          cd apps/desktop
          npm install --package-lock-only --ignore-scripts

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Test desktop frontend
        working-directory: apps/desktop
        run: npm test

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Prepare Tauri sidecar
        run: |
          cargo build -p homerund
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/debug/homerund apps/desktop/src-tauri/binaries/homerund-x86_64-unknown-linux-gnu

      - name: Check Tauri application
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Commit validated non-workflow changes
        shell: bash
        run: |
          git add Cargo.toml Cargo.lock \
            apps/desktop/package.json apps/desktop/package-lock.json \
            apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock \
            apps/desktop/src-tauri/tauri.conf.json \
            .release-please-manifest.json CHANGELOG.md
          git add -A .release-inspection.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: prepare v0.8.5 release metadata"
          git push origin HEAD:agent/release-v0.8.5
