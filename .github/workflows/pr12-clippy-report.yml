name: PR 12 Clippy Fix

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 12
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/delete-integrity-and-start-admission-2026-07-24
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply documented Clippy exception
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/daemon/src/runner/mod.rs')
          text = path.read_text()
          marker = '    async fn create_with_intent(\n'
          replacement = '''    // This private adapter mirrors the public creation inputs and adds one
              // atomic persistence flag. Keeping the arguments explicit avoids a second,
              // duplicative request type solely for internal transaction handling.
              #[allow(clippy::too_many_arguments)]
              async fn create_with_intent(
          '''
          if '#[allow(clippy::too_many_arguments)]\n    async fn create_with_intent(' not in text:
              if text.count(marker) != 1:
                  raise RuntimeError('create_with_intent marker changed unexpectedly')
              text = text.replace(marker, replacement, 1)
              path.write_text(text)
          PY
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          git diff --check
      - name: Commit Clippy fix
        run: |
          if git diff --quiet; then
            echo "Clippy fix already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/daemon/src/runner/mod.rs
          git commit -m "fix: document atomic creation adapter arguments"
          git push origin HEAD:audit/delete-integrity-and-start-admission-2026-07-24
