name: Agent inspect published v0.8.5 release

on:
  push:
    branches:
      - agent/inspect-release-prep-run

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/inspect-release-prep-run
      - name: Inspect release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '=== RELEASE ==='
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.8.5" \
              --jq '{html_url,tag_name,name,draft,prerelease,published_at,target_commitish,assets:[.assets[]|{name,size,state,browser_download_url}]}'
            echo
            echo '=== TAG ==='
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.8.5" --jq '{ref,object}'
            echo
            echo '=== MASTER ==='
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '{ref,object}'
          } > .published-release.txt
      - name: Commit report and remove workflow
        run: |
          git rm .github/workflows/agent-inspect-v0.8.5-release.yml
          git add .published-release.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: record published v0.8.5 release"
          git push origin HEAD:agent/inspect-release-prep-run
