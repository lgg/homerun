name: PR14 Dependency Audit

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'audit/post-merge-runtime-consistency-2026-07-31'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/post-merge-runtime-consistency-2026-07-31
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Capture npm audits
        working-directory: apps/desktop
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-all.json
          echo "$?" > npm-audit-all.status
          npm audit --omit=dev --json > npm-audit-production.json
          echo "$?" > npm-audit-production.status
          npm outdated --json > npm-outdated.json
          echo "$?" > npm-outdated.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr14-dependency-audit
          path: |
            apps/desktop/npm-audit-all.json
            apps/desktop/npm-audit-all.status
            apps/desktop/npm-audit-production.json
            apps/desktop/npm-audit-production.status
            apps/desktop/npm-outdated.json
            apps/desktop/npm-outdated.status
          retention-days: 1
