name: Full Product Audit Validation

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit/full-product-function-screen-audit-2026-07-25'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/full-product-function-screen-audit-2026-07-25
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Reconstruct and apply staged patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .audit/full-product-patch.00 ]]; then
            echo 'No staged patch remains; branch is already updated.'
            echo 'applied=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat .audit/full-product-patch.* | base64 --decode | gzip --decompress > /tmp/full-product-audit.patch
          wc -c /tmp/full-product-audit.patch
          sha256sum /tmp/full-product-audit.patch
          git apply --check /tmp/full-product-audit.patch
          git apply /tmp/full-product-audit.patch
          rm -rf .audit
          echo 'applied=true' >> "$GITHUB_OUTPUT"
      - name: Update Rust lockfiles
        if: steps.patch.outputs.applied == 'true'
        run: |
          cargo generate-lockfile
          cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Capture Rust formatting diagnostics
        if: steps.patch.outputs.applied == 'true'
        shell: bash
        run: |
          set +e
          cargo fmt --all > /tmp/rustfmt.log 2>&1
          echo "$?" > /tmp/rustfmt.status
          exit 0
      - uses: actions/upload-artifact@v4
        if: steps.patch.outputs.applied == 'true'
        with:
          name: full-audit-rustfmt-diagnostics
          path: |
            /tmp/rustfmt.log
            /tmp/rustfmt.status
          retention-days: 1
      - name: Verify formatting and patch
        if: steps.patch.outputs.applied == 'true'
        run: |
          status=$(cat /tmp/rustfmt.status)
          if [[ "$status" != '0' ]]; then
            cat /tmp/rustfmt.log
            exit "$status"
          fi
          git diff --check
      - name: Commit applied product audit fixes
        if: steps.patch.outputs.applied == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete declared product functions and screens'
          git push origin HEAD:audit/full-product-function-screen-audit-2026-07-25

  linux:
    needs: apply
    if: github.head_ref == 'audit/full-product-function-screen-audit-2026-07-25'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/full-product-function-screen-audit-2026-07-25
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Frontend tests
        working-directory: apps/desktop
        run: npm test
      - name: Type check
        working-directory: apps/desktop
        run: npm exec -- tsc --noEmit
      - name: Frontend production build
        working-directory: apps/desktop
        run: npm run build
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust workspace tests
        run: cargo test --workspace --all-targets
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Release daemon and TUI build
        run: cargo build --release -p homerund -p homerun
      - name: Prepare Tauri sidecar
        working-directory: apps/desktop
        run: npm run prepare-sidecar
      - name: Linux Tauri check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets

  windows:
    needs: apply
    if: github.head_ref == 'audit/full-product-function-screen-audit-2026-07-25'
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/full-product-function-screen-audit-2026-07-25
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Frontend tests
        working-directory: apps/desktop
        run: npm test
      - name: Type check
        working-directory: apps/desktop
        run: npm exec -- tsc --noEmit
      - name: Frontend production build
        working-directory: apps/desktop
        run: npm run build
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust workspace tests
        run: cargo test --workspace --all-targets
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Release daemon and TUI build
        run: cargo build --release -p homerund -p homerun
      - name: Prepare Tauri sidecar
        working-directory: apps/desktop
        run: npm run prepare-sidecar
      - name: Windows Tauri check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
