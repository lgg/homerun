name: Full Product Clean Validation

on:
  pull_request:
    branches: [master]
    types: [reopened]

permissions:
  contents: read

jobs:
  static:
    if: github.event.pull_request.number == 13
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/full-product-function-screen-audit-2026-07-25
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify patch integrity
        run: |
          git diff --check origin/master...HEAD
          test ! -d .audit
      - name: Check changed text formatting
        run: |
          npx --yes prettier@3.9.5 --check \
            .github/workflows/ci.yml \
            .github/workflows/release-build.yml \
            .github/workflows/full-audit-source.yml \
            apps/desktop/src-tauri/capabilities/default.json \
            apps/desktop/src/api/bridge.test.ts \
            apps/desktop/src/api/commands.ts \
            apps/desktop/src/api/types.ts \
            apps/desktop/src/components/NewRunnerWizard.tsx \
            apps/desktop/src/hooks/useEvents.ts \
            apps/desktop/src/hooks/useNotifications.test.ts \
            apps/desktop/src/hooks/useNotifications.ts \
            apps/desktop/src/hooks/useRepos.ts \
            apps/desktop/src/hooks/useRunners.ts \
            apps/desktop/src/hooks/useScan.test.ts \
            apps/desktop/src/hooks/useScan.ts \
            apps/desktop/src/pages/Repositories.tsx \
            apps/desktop/src/pages/Settings.tsx
      - name: Verify no unfinished production placeholders
        shell: bash
        run: |
          if git grep -nE 'todo!\(|unimplemented!\(|TODO: implement|coming soon|onClick=\{\(\) => \{\}\}' -- \
            ':!**/*test*' ':!**/tests/**' ':!README.md' ':!docs/**' \
            ':!.github/workflows/full-audit-source.yml'; then
            echo 'Unfinished production placeholder found'
            exit 1
          fi

  linux:
    if: github.event.pull_request.number == 13
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/full-product-function-screen-audit-2026-07-25
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Frontend tests
        working-directory: apps/desktop
        run: npm test
      - name: Type check
        working-directory: apps/desktop
        run: npm exec -- tsc --noEmit
      - name: Frontend production build
        working-directory: apps/desktop
        run: npm run build
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust workspace tests
        run: cargo test --workspace --all-targets
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Release daemon and TUI build
        run: cargo build --release -p homerund -p homerun
      - name: CLI surface smoke test
        run: |
          ./target/release/homerun --help
          ./target/release/homerun --no-tui add --help
          ./target/release/homerun --no-tui daemon autostart --help
      - name: Prepare Tauri sidecar
        working-directory: apps/desktop
        run: npm run prepare-sidecar
      - name: Linux Tauri check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets

  windows:
    if: github.event.pull_request.number == 13
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/full-product-function-screen-audit-2026-07-25
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Frontend tests
        working-directory: apps/desktop
        run: npm test
      - name: Type check
        working-directory: apps/desktop
        run: npm exec -- tsc --noEmit
      - name: Frontend production build
        working-directory: apps/desktop
        run: npm run build
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust workspace tests
        run: cargo test --workspace --all-targets
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Release daemon and TUI build
        run: cargo build --release -p homerund -p homerun
      - name: CLI surface smoke test
        shell: pwsh
        run: |
          .\target\release\homerun.exe --help
          .\target\release\homerun.exe --no-tui add --help
          .\target\release\homerun.exe --no-tui daemon autostart --help
      - name: Prepare Tauri sidecar
        working-directory: apps/desktop
        run: npm run prepare-sidecar
      - name: Windows Tauri check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
