name: Full Product Audit Diagnostics

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: read

jobs:
  frontend:
    if: github.head_ref == 'audit/full-product-function-screen-audit-2026-07-25'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/full-product-function-screen-audit-2026-07-25
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Capture frontend tests
        shell: bash
        working-directory: apps/desktop
        run: |
          set +e
          npm test > /tmp/frontend-tests.log 2>&1
          echo "$?" > /tmp/frontend-tests.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: full-audit-frontend-diagnostics
          path: |
            /tmp/frontend-tests.log
            /tmp/frontend-tests.status
          retention-days: 1
      - name: Report failures
        working-directory: apps/desktop
        run: |
          status=$(cat /tmp/frontend-tests.status)
          if [[ "$status" != '0' ]]; then
            grep -nE 'FAIL|AssertionError|expected|received|Error:' /tmp/frontend-tests.log || true
            tail -n 250 /tmp/frontend-tests.log
          fi
          exit "$status"
