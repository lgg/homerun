name: Delete Authentication Invariant Patch

on:
  pull_request:
    branches: [master]
    types: [reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/delete-integrity-and-start-admission-2026-07-24
          fetch-depth: 0
      - name: Apply reviewed invariant patch
        run: |
          git fetch origin master
          git show origin/master:.github/workflows/delete-integrity-final-validation.yml > /tmp/final-validation.yml
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/final-validation.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          script_lines = [line[10:] if line.startswith('          ') else line for line in lines[start:end]]
          script = '\n'.join(script_lines) + '\n'
          script = script.replace(
              'let scaling_down = req.count as usize < existing.len();',
              'let scaling_down = (req.count as usize) < existing.len();',
          )
          Path('/tmp/apply.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/apply.py
          cargo fmt --all
          git diff --check
      - name: Commit production changes
        run: |
          if git diff --quiet; then
            echo "Invariant already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/daemon/src/runner/mod.rs crates/daemon/src/api/runners.rs crates/daemon/src/api/groups.rs
          git commit -m "fix: require authentication before deleting configured runners"
          git push origin HEAD:audit/delete-integrity-and-start-admission-2026-07-24
