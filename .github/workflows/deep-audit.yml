name: Deep Audit Validation

on:
  push:
    branches: [audit/post-upstream-stability-2026-07-24]

permissions:
  contents: write

concurrency:
  group: deep-audit-post-upstream-stability
  cancel-in-progress: false

jobs:
  linux-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v6
        with:
          ref: audit/post-upstream-stability-2026-07-24
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Apply reviewed audit patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/maintenance/deep-audit.patch.gz.b64 | gzip --decompress > /tmp/audit.patch
          if git apply --reverse --check /tmp/audit.patch >/dev/null 2>&1; then
            echo "Audit patch is already applied"
          else
            git apply --check /tmp/audit.patch
            git apply /tmp/audit.patch
          fi

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Format audited files
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop
          npx prettier --write package-lock.json src/components/NewRunnerWizard.test.tsx src/components/NewRunnerWizard.tsx src/components/RunnerTable.tsx
          cd ../..
          cargo fmt --all

      - name: Frontend tests
        working-directory: apps/desktop
        run: npm test

      - name: Frontend production build
        working-directory: apps/desktop
        run: npm run build

      - name: Rust workspace tests
        run: cargo test --workspace --all-targets

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev build-essential pkg-config

      - name: Prepare Tauri sidecar
        run: |
          cargo build -p homerund
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/debug/homerund apps/desktop/src-tauri/binaries/homerund-x86_64-unknown-linux-gnu

      - name: Check Tauri application
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Commit verified source fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -f apps/desktop/src-tauri/binaries/homerund-x86_64-unknown-linux-gnu
          rmdir apps/desktop/src-tauri/binaries 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/package-lock.json apps/desktop/src/components/NewRunnerWizard.test.tsx apps/desktop/src/components/NewRunnerWizard.tsx apps/desktop/src/components/RunnerTable.tsx crates/daemon/src/api/groups.rs crates/daemon/src/api/runners.rs crates/daemon/src/runner/mod.rs crates/daemon/src/runner/state.rs crates/daemon/src/runner/types.rs crates/daemon/src/server.rs
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "fix: harden audited runner and window lifecycle changes"
            git push origin HEAD:audit/post-upstream-stability-2026-07-24
          fi

  windows-audit:
    needs: linux-audit
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout latest audit branch
        uses: actions/checkout@v6
        with:
          ref: audit/post-upstream-stability-2026-07-24

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Frontend tests and build
        working-directory: apps/desktop
        run: |
          npm test
          npm run build

      - name: Rust workspace tests
        run: cargo test --workspace --all-targets

      - name: Prepare Windows Tauri sidecar
        shell: pwsh
        run: |
          cargo build -p homerund
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/binaries
          Copy-Item target/debug/homerund.exe apps/desktop/src-tauri/binaries/homerund-x86_64-pc-windows-msvc.exe

      - name: Check Windows Tauri application
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
