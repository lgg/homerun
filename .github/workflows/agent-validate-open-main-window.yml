name: Agent validate tray main window

on:
  push:
    branches:
      - agent/open-main-window-from-tray

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/open-main-window-from-tray
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Test desktop frontend
        working-directory: apps/desktop
        run: npm test

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Prepare Tauri sidecar
        run: |
          cargo build -p homerund
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/debug/homerund apps/desktop/src-tauri/binaries/homerund-x86_64-unknown-linux-gnu

      - name: Check Tauri application
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Remove temporary validation workflow
        run: git rm .github/workflows/agent-validate-open-main-window.yml

      - name: Commit validated feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary validation workflow"
          git push origin HEAD:agent/open-main-window-from-tray
