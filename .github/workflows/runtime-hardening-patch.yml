name: Apply runtime hardening patch

on:
  push:
    branches: [fix/runtime-signal-shell-plist-hardening]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/runtime-signal-shell-plist-hardening
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply verified runtime hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) Graceful shutdown must never panic when OS signal registration fails.
          path = Path("crates/daemon/src/server.rs")
          text = path.read_text()
          old = '''        let shutdown_signal = async {
              let mut sigterm =
                  tokio::signal::unix::signal(tokio::signal::unix::SignalKind::terminate())
                      .expect("failed to register SIGTERM handler");
              let sigint = tokio::signal::ctrl_c();
              tokio::select! {
                  _ = sigterm.recv() => tracing::info!("Received SIGTERM"),
                  _ = sigint => tracing::info!("Received SIGINT"),
              }
          };
          '''
          new = '''        let mut sigterm =
              tokio::signal::unix::signal(tokio::signal::unix::SignalKind::terminate())?;
          let shutdown_signal = async move {
              let sigint = tokio::signal::ctrl_c();
              tokio::select! {
                  signal = sigterm.recv() => {
                      if signal.is_some() {
                          tracing::info!("Received SIGTERM");
                      } else {
                          tracing::warn!("SIGTERM handler closed; shutting down");
                      }
                  }
                  signal = sigint => match signal {
                      Ok(()) => tracing::info!("Received SIGINT"),
                      Err(error) => tracing::error!(%error, "Ctrl-C handler failed; shutting down"),
                  },
              }
          };
          '''
          if old not in text:
              raise SystemExit("unix shutdown block did not match")
          text = text.replace(old, new, 1)
          old = '''        let shutdown_signal = async {
              tokio::signal::ctrl_c()
                  .await
                  .expect("failed to register Ctrl-C handler");
              tracing::info!("Received Ctrl-C");
          };
          '''
          new = '''        let shutdown_signal = async {
              match tokio::signal::ctrl_c().await {
                  Ok(()) => tracing::info!("Received Ctrl-C"),
                  Err(error) => tracing::error!(%error, "Ctrl-C handler failed; shutting down"),
              }
          };
          '''
          if old not in text:
              raise SystemExit("windows shutdown block did not match")
          path.write_text(text.replace(old, new, 1))

          # 2) Shell PATH resolution must recover from a stale/broken $SHELL and
          #    Windows registry lookup failures must not bypass filesystem fallbacks.
          path = Path("crates/daemon/src/platform/shell.rs")
          text = path.read_text()
          start = text.index("/// Resolve the full PATH from the user's login shell.")
          end = text.index("/// On Windows the system PATH is usually inherited")
          unix_block = '''/// Resolve PATH by asking one concrete Unix shell.
          #[cfg(unix)]
          fn shell_path_from(shell: &str) -> Option<String> {
              use std::process::Stdio;

              let output = std::process::Command::new(shell)
                  .args(["-l", "-c", "echo $PATH"])
                  .stdout(Stdio::piped())
                  .stderr(Stdio::null())
                  .output()
                  .ok()?;
              if !output.status.success() {
                  return None;
              }

              let path = String::from_utf8_lossy(&output.stdout).trim().to_string();
              (!path.is_empty()).then_some(path)
          }

          #[cfg(unix)]
          fn resolve_shell_path_with(
              configured_shell: Option<&str>,
              inherited_path: Option<&str>,
          ) -> Option<String> {
              if let Some(shell) = configured_shell {
                  if let Some(path) = shell_path_from(shell) {
                      return Some(path);
                  }
              }

              // $SHELL can point at a removed Homebrew/nix shell. /bin/sh is the
              // portable fallback on Unix, so retry it even when SHELL was set.
              if configured_shell != Some("/bin/sh") {
                  if let Some(path) = shell_path_from("/bin/sh") {
                      return Some(path);
                  }
              }

              inherited_path
                  .map(str::trim)
                  .filter(|path| !path.is_empty())
                  .map(ToOwned::to_owned)
          }

          /// Resolve the full PATH from the user's login shell.
          /// This picks up paths added by nvm, fnm, Homebrew, etc. that aren't
          /// available in a bare launchd environment. If the configured shell is
          /// stale, fall back to /bin/sh and finally the inherited PATH.
          #[cfg(unix)]
          pub fn resolve_shell_path() -> Option<String> {
              let shell = std::env::var("SHELL").ok();
              let inherited_path = std::env::var("PATH").ok();
              resolve_shell_path_with(shell.as_deref(), inherited_path.as_deref())
          }

          '''
          text = text[:start] + unix_block + text[end:]
          old = '''    let output = Command::new("reg")
              .args(["query", r"HKLM\\SOFTWARE\\GitForWindows", "/v", "InstallPath"])
              .stdout(Stdio::piped())
              .stderr(Stdio::null())
              .output()
              .ok()?;

          let stdout = String::from_utf8_lossy(&output.stdout);
          for line in stdout.lines() {
              // Output line looks like: "    InstallPath    REG_SZ    C:\\Program Files\\Git"
              if let Some(pos) = line.find("REG_SZ") {
                  let path = line[pos + "REG_SZ".len()..].trim();
                  if !path.is_empty() {
                      let p = PathBuf::from(path);
                      if p.is_dir() {
                          return Some(p);
                      }
                  }
              }
          }
          '''
          new = '''    if let Ok(output) = Command::new("reg")
              .args(["query", r"HKLM\\SOFTWARE\\GitForWindows", "/v", "InstallPath"])
              .stdout(Stdio::piped())
              .stderr(Stdio::null())
              .output()
          {
              let stdout = String::from_utf8_lossy(&output.stdout);
              for line in stdout.lines() {
                  // Output line looks like: "    InstallPath    REG_SZ    C:\\Program Files\\Git"
                  if let Some(pos) = line.find("REG_SZ") {
                      let path = line[pos + "REG_SZ".len()..].trim();
                      if !path.is_empty() {
                          let p = PathBuf::from(path);
                          if p.is_dir() {
                              return Some(p);
                          }
                      }
                  }
              }
          }
          '''
          if old not in text:
              raise SystemExit("windows git registry block did not match")
          text = text.replace(old, new, 1)
          marker = '''    #[cfg(unix)]
              #[test]
              fn resolve_shell_path_returns_some_on_unix() {
          '''
          # Insert deterministic Unix regression coverage before the existing Unix test.
          insert_at = text.index(marker)
          tests = '''    #[cfg(unix)]
              #[test]
              fn missing_configured_shell_falls_back_to_bin_sh() {
                  let path = resolve_shell_path_with(
                      Some("/definitely/missing/homerun-shell"),
                      Some("/inherited/fallback"),
                  )
                  .expect("/bin/sh should provide a fallback PATH");
                  assert_ne!(path, "/inherited/fallback");
              }

              #[cfg(unix)]
              #[test]
              fn missing_shell_command_is_reported_as_unavailable() {
                  assert!(shell_path_from("/definitely/missing/homerun-shell").is_none());
              }

          '''
          text = text[:insert_at] + tests + text[insert_at:]
          path.write_text(text)

          # 3) launchd plist values are XML text and must be escaped.
          path = Path("crates/daemon/src/platform/service.rs")
          text = path.read_text()
          prefix = '''#[cfg(any(target_os = "macos", test))]
          fn xml_escape(value: &str) -> String {
              let mut escaped = String::with_capacity(value.len());
              for ch in value.chars() {
                  match ch {
                      '&' => escaped.push_str("&amp;"),
                      '<' => escaped.push_str("&lt;"),
                      '>' => escaped.push_str("&gt;"),
                      '"' => escaped.push_str("&quot;"),
                      '\\'' => escaped.push_str("&apos;"),
                      _ => escaped.push(ch),
                  }
              }
              escaped
          }

          '''
          if not text.startswith('#[cfg(target_os = "macos")]'):
              raise SystemExit("service.rs prefix changed")
          text = prefix + text
          text = text.replace(
              '''mod macos {
              use anyhow::{Context, Result};''',
              '''mod macos {
              use super::xml_escape;
              use anyhow::{Context, Result};''',
              1,
          )
          old = '''    fn resolve_shell_path() -> String {
              let shell = std::env::var("SHELL").unwrap_or_else(|_| "/bin/zsh".to_string());
              if let Ok(output) = std::process::Command::new(&shell)
                  .args(["-l", "-c", "echo $PATH"])
                  .stdout(std::process::Stdio::piped())
                  .stderr(std::process::Stdio::null())
                  .output()
              {
                  let path = String::from_utf8_lossy(&output.stdout).trim().to_string();
                  if !path.is_empty() {
                      return path;
                  }
              }
              // Fallback to a sensible default
              "/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin".to_string()
          }
          '''
          new = '''    fn resolve_shell_path() -> String {
              crate::platform::shell::resolve_shell_path().unwrap_or_else(|| {
                  "/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin".to_string()
              })
          }
          '''
          if old not in text:
              raise SystemExit("macOS shell resolver block did not match")
          text = text.replace(old, new, 1)
          old = '''        let home = home_dir_str()?;
              let path = resolve_shell_path();
              Ok(format!(
          '''
          new = '''        let home = xml_escape(&home_dir_str()?);
              let path = xml_escape(&resolve_shell_path());
              let daemon_path = xml_escape(&daemon_path.display().to_string());
              Ok(format!(
          '''
          if old not in text:
              raise SystemExit("build_plist values block did not match")
          text = text.replace(old, new, 1)
          text = text.replace('<string>{}</string>', '<string>{daemon_path}</string>', 1)
          text = text.replace('''</plist>"#,
                  daemon_path.display(),
              ))''', '''</plist>"#,
              ))''', 1)
          test_marker = '''    #[test]
              fn test_is_daemon_installed_returns_bool() {
          '''
          insert_at = text.index(test_marker)
          tests = '''    #[test]
              fn test_xml_escape_handles_reserved_plist_characters() {
                  assert_eq!(
                      xml_escape("A&B <runner> \\\"quoted\\\" 'single'"),
                      "A&amp;B &lt;runner&gt; &quot;quoted&quot; &apos;single&apos;"
                  );
              }

          '''
          text = text[:insert_at] + tests + text[insert_at:]
          path.write_text(text)
          PY

          cargo fmt --all -- --check || cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked -p homerund

      - name: Commit product changes and self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/runtime-hardening-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/daemon/src/server.rs crates/daemon/src/platform/shell.rs crates/daemon/src/platform/service.rs
          git commit -m "fix: harden daemon runtime platform handling"
          git push origin HEAD:fix/runtime-signal-shell-plist-hardening
