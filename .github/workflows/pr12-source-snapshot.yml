name: PR 12 Source Snapshot

on:
  pull_request:
    branches: [master]
    types: [reopened]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event.pull_request.number == 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/delete-integrity-and-start-admission-2026-07-24
      - name: Package source tree
        run: |
          tar --exclude=.git --exclude=target --exclude=node_modules --exclude=dist -czf /tmp/homerun-pr12-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: homerun-pr12-source
          path: /tmp/homerun-pr12-source.tar.gz
          retention-days: 1
