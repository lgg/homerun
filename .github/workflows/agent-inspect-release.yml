name: Agent inspect release setup

on:
  push:
    branches:
      - agent/release-v0.8.5
  pull_request:
    branches:
      - master

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List workflows and version files
        shell: bash
        run: |
          echo '=== WORKFLOWS ==='
          find .github/workflows -maxdepth 1 -type f -print | sort
          echo '=== WORKFLOW HEADERS ==='
          for file in .github/workflows/*; do
            echo "--- $file"
            sed -n '1,80p' "$file"
          done
          echo '=== VERSIONS ==='
          grep -R --line-number --exclude-dir=target --exclude='package-lock.json' '0\.8\.4' Cargo.toml crates apps/desktop | head -100 || true
          echo '=== TAGS / RELEASES ==='
          git tag --sort=-v:refname | head -20
          curl -fsSL -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=10" \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); print("\n".join(f"{r[\"tag_name\"]} draft={r[\"draft\"]} prerelease={r[\"prerelease\"]} assets={len(r[\"assets\"])}" for r in data))'
