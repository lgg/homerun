name: Agent attach v0.8.5 Linux bundles

on:
  push:
    branches:
      - agent/attach-v0.8.5-linux

permissions:
  actions: read
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: HomeRun-linux-x64
          path: artifacts
          repository: lgg/homerun
          run-id: 29636673088
          github-token: ${{ github.token }}

      - name: Flatten release files
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp '{}' release-assets/ \;
          find release-assets -maxdepth 1 -type f -print | sort

      - name: Attach Linux bundles to v0.8.5
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.5
          files: release-assets/*
          fail_on_unmatched_files: true
