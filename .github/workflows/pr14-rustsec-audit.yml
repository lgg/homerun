name: PR14 Final Audit Gate

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: read

jobs:
  ubuntu-verify:
    if: github.head_ref == 'audit/post-merge-runtime-consistency-2026-07-31'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/post-merge-runtime-consistency-2026-07-31
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Verify clean source tree
        run: |
          cargo fmt --all -- --check
          git diff --check
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Verify frontend
        working-directory: apps/desktop
        run: |
          npm run test:coverage
          npm exec -- tsc --noEmit
          npm run build
      - name: Verify Rust workspace
        run: |
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo build --release -p homerun -p homerund
          ./target/release/homerun --help
      - name: Verify soundness dependencies
        shell: bash
        run: |
          if cargo tree -i lru@0.12.5 >/tmp/old-lru.txt 2>&1; then
            cat /tmp/old-lru.txt
            echo 'Old unsound lru version is still reachable'
            exit 1
          fi
          cargo tree -i lru@0.18.1
          if cargo tree -i paste@1.0.15 >/tmp/paste.txt 2>&1; then
            cat /tmp/paste.txt
            echo 'Unmaintained paste dependency is still reachable'
            exit 1
          fi

  windows-verify:
    if: github.head_ref == 'audit/post-merge-runtime-consistency-2026-07-31'
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/post-merge-runtime-consistency-2026-07-31
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify Windows Rust workspace
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo build --release -p homerun -p homerund
          .\target\release\homerun.exe --help
