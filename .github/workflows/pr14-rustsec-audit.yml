name: PR14 RustSec Dependency Chains

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'audit/post-merge-runtime-consistency-2026-07-31'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/post-merge-runtime-consistency-2026-07-31
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture dependency chains
        shell: bash
        run: |
          cargo tree -i lru@0.12.5 > /tmp/lru-chain.txt
          cargo tree -i paste@1.0.15 > /tmp/paste-chain.txt
          cargo tree --manifest-path apps/desktop/src-tauri/Cargo.toml -i glib@0.18.5 > /tmp/glib-chain.txt
          cargo tree --manifest-path apps/desktop/src-tauri/Cargo.toml -i atk@0.18.2 > /tmp/atk-chain.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr14-rustsec-chains
          path: |
            /tmp/lru-chain.txt
            /tmp/paste-chain.txt
            /tmp/glib-chain.txt
            /tmp/atk-chain.txt
          retention-days: 1
