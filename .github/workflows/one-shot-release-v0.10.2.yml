name: One-shot v0.10.2 Release

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/one-shot-release-v0.10.2.yml

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Bump project version to 0.10.2
        shell: python
        run: |
          import json
          import pathlib
          import re

          old = "0.10.1"
          new = "0.10.2"

          def bump_toml(path, section):
              p = pathlib.Path(path)
              text = p.read_text()
              pattern = rf"(\[{re.escape(section)}\][\s\S]*?\nversion\s*=\s*\"){re.escape(old)}(\")"
              updated, count = re.subn(pattern, rf"\g<1>{new}\g<2>", text, count=1)
              if count != 1:
                  raise SystemExit(f"Could not bump {path} [{section}] from {old}")
              p.write_text(updated)

          bump_toml("Cargo.toml", "workspace.package")
          bump_toml("apps/desktop/src-tauri/Cargo.toml", "package")

          for path in ["apps/desktop/package.json", "apps/desktop/src-tauri/tauri.conf.json"]:
              p = pathlib.Path(path)
              data = json.loads(p.read_text())
              if data.get("version") != old:
                  raise SystemExit(f"Unexpected version in {path}: {data.get('version')}")
              data["version"] = new
              p.write_text(json.dumps(data, indent=2) + "\n")

          manifest = pathlib.Path(".release-please-manifest.json")
          data = json.loads(manifest.read_text())
          if data.get(".") != old:
              raise SystemExit(f"Unexpected release manifest version: {data.get('.')}")
          data["."] = new
          manifest.write_text(json.dumps(data, indent=2) + "\n")

          changelog = pathlib.Path("CHANGELOG.md")
          text = changelog.read_text()
          marker = "---\n\n"
          entry = (
              "## [0.10.2](https://github.com/lgg/homerun/compare/v0.10.1...v0.10.2) (2026-08-28)\n\n"
              "### Bug Fixes\n\n"
              "* keep Mini View inside connected monitor work areas and recover stale off-screen positions\n"
              "* show and focus Mini View successfully before hiding the main window\n"
              "* revalidate Mini View bounds after moves and dynamic content resizing\n\n"
          )
          if "## [0.10.2]" not in text:
              if marker not in text:
                  raise SystemExit("CHANGELOG insertion marker not found")
              text = text.replace(marker, marker + entry, 1)
              changelog.write_text(text)

      - name: Regenerate release lockfiles
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
          cd apps/desktop
          npm install --package-lock-only --ignore-scripts

      - name: Commit clean release state
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-release-v0.10.2.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(master): release 0.10.2"
          git push origin HEAD:master

      - name: Create GitHub release and dispatch builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA=$(git rev-parse HEAD)
          if gh release view v0.10.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.10.2 release already exists"
          else
            gh release create v0.10.2 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "v0.10.2" \
              --generate-notes
          fi
          gh workflow run release-build.yml --repo "$GITHUB_REPOSITORY" --ref v0.10.2
