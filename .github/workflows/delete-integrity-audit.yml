name: Delete Integrity Audit Patch

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/delete-integrity-and-start-admission-2026-07-24
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - id: apply
        name: Apply deterministic audit patch
        shell: bash
        run: |
          set +e
          python .github/scripts/apply-delete-integrity-audit.py > patch.log 2>&1
          status=$?
          echo "$status" > patch.status
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: delete-integrity-patch-report
          path: |
            patch.log
            patch.status
          retention-days: 1
      - name: Format and verify patch
        if: steps.apply.outputs.status == '0'
        run: |
          cargo fmt --all
          git diff --check
      - name: Commit production changes
        if: steps.apply.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/daemon/src/github/mod.rs crates/daemon/src/runner/mod.rs crates/daemon/src/runner/process.rs crates/daemon/src/runner/docker.rs crates/daemon/src/api/runners.rs crates/daemon/src/api/groups.rs
          git commit -m "fix: make deletion and start admission failure-safe"
          git push origin HEAD:audit/delete-integrity-and-start-admission-2026-07-24

  report:
    if: always() && github.event.pull_request.number == 12
    needs: patch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: delete-integrity-patch-report
      - name: Report patch result
        shell: bash
        run: |
          status=$(cat patch.status)
          cat patch.log
          exit "$status"
