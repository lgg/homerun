name: Agent fetch release prep log tail

on:
  push:
    branches:
      - agent/inspect-release-prep-run

permissions:
  contents: write
  actions: read

jobs:
  fetch-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/inspect-release-prep-run
      - name: Download job log tail
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: "88058486537"
        shell: bash
        run: |
          curl -fsSL -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            -o job.log
          tail -n 250 job.log > .prep-run-tail.txt
      - name: Commit log tail and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/agent-fetch-prep-log.yml
          git add .prep-run-tail.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: record release prep failure tail"
          git push origin HEAD:agent/inspect-release-prep-run
