name: Final audit patcher

on:
  push:
    branches: [audit/final-post-release-2026-08-11]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/final-post-release-2026-08-11
          fetch-depth: 0

      - name: Apply audited source and changelog fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}")
              file.write_text(text.replace(old, new, 1))

          validation_old = "        if owner.is_empty() || repo.is_empty() || repo.contains('/') {\n            bail!(\"Invalid repo name: expected non-empty 'owner/repo'\");\n        }\n"
          validation_new = validation_old + "        if owner\n            .chars()\n            .chain(repo.chars())\n            .any(|character| character.is_whitespace() || character.is_control())\n        {\n            bail!(\"Invalid repo name: whitespace and control characters are not allowed\");\n        }\n"
          replace_once("crates/daemon/src/runner/mod.rs", validation_old, validation_new)

          test_old = "    #[test]\n    fn test_validate_create_request_rejects_empty_repository_parts() {\n        for invalid in [\"repo\", \"/repo\", \"owner/\", \"owner/repo/extra\"] {\n            assert!(RunnerManager::validate_create_request(invalid, None, None, None).is_err());\n        }\n    }\n"
          test_new = "    #[test]\n    fn test_validate_create_request_rejects_malformed_repository_names() {\n        for invalid in [\n            \"repo\",\n            \"/repo\",\n            \"owner/\",\n            \"owner/repo/extra\",\n            \" owner/repo\",\n            \"owner /repo\",\n            \"owner/ repo\",\n            \"owner/repo \",\n            \"owner/\\\\trepo\",\n            \"owner/repo\\\\n\",\n        ] {\n            assert!(RunnerManager::validate_create_request(invalid, None, None, None).is_err());\n        }\n        assert!(RunnerManager::validate_create_request(\"owner/repo\", None, None, None).is_ok());\n    }\n"
          replace_once("crates/daemon/src/runner/mod.rs", test_old, test_new)

          replace_once(
              "CHANGELOG.md",
              "https://github.com/lgg/homerun/compare/v0.9.1...v0.10.0",
              "https://github.com/lgg/homerun/compare/v0.8.5...v0.10.0",
          )
          PY

      - name: Format and validate targeted Rust changes
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p homerund test_validate_create_request_rejects_malformed_repository_names
          cargo clippy -p homerund --all-targets --all-features -- -D warnings

      - name: Correct published v0.10.0 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v0.10.0 --repo "$GITHUB_REPOSITORY" --json body > /tmp/release.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/release.json').read_text())
          body = data['body']
          old = 'https://github.com/lgg/homerun/compare/v0.9.1...v0.10.0'
          new = 'https://github.com/lgg/homerun/compare/v0.8.5...v0.10.0'
          if old not in body:
              raise SystemExit('expected broken v0.10.0 compare link was not found in release notes')
          Path('/tmp/release-notes.md').write_text(body.replace(old, new))
          PY
          gh release edit v0.10.0 --repo "$GITHUB_REPOSITORY" --notes-file /tmp/release-notes.md

      - name: Commit fixes and remove one-shot patcher
        run: |
          set -euo pipefail
          git rm .github/workflows/final-audit-patcher.yml
          git add CHANGELOG.md crates/daemon/src/runner/mod.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: close final post-release audit gaps"
          git push origin HEAD:audit/final-post-release-2026-08-11
