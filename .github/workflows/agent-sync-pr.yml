name: Prepare upstream merge tree

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: agent-sync-upstream-stability-pr
  cancel-in-progress: false

jobs:
  prepare-merged-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch with full history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Merge upstream source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LOCAL_BASE_SHA="$(git merge-base HEAD origin/master)"
          git remote add upstream https://github.com/aGallea/homerun.git
          git fetch upstream master
          git merge --no-commit --no-ff -X theirs upstream/master
          git checkout "$LOCAL_BASE_SHA" -- \
            apps/desktop/src/components/RunnerTable.tsx \
            apps/desktop/src/pages/RunnerDetail.tsx
          tar --exclude=.git --exclude=target --exclude=node_modules -czf /tmp/merged-source.tar.gz .

      - name: Upload merged source tree
        uses: actions/upload-artifact@v4
        with:
          name: merged-source
          path: /tmp/merged-source.tar.gz
          if-no-files-found: error
          retention-days: 1
