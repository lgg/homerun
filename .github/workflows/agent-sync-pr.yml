name: Publish verified upstream merge

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agent-sync-upstream-stability-pr
  cancel-in-progress: false

jobs:
  publish-merge:
    if: ${{ !contains(github.event.pull_request.title, '[sync-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch with full history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Configure Rust formatter
        uses: dtolnay/rust-toolchain@stable

      - name: Create reviewed merge commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LOCAL_HEAD_SHA="$(git rev-parse HEAD)"
          LOCAL_BASE_SHA="$(git merge-base HEAD origin/master)"
          git remote add upstream https://github.com/aGallea/homerun.git
          git fetch upstream master
          git merge --no-commit --no-ff -X theirs upstream/master

          git checkout "$LOCAL_BASE_SHA" -- \
            apps/desktop/src/components/RunnerTable.tsx \
            apps/desktop/src/pages/RunnerDetail.tsx

          git apply --check .github/maintenance/homerun-source-fixes.patch
          git apply .github/maintenance/homerun-source-fixes.patch
          cargo fmt --all

          # GITHUB_TOKEN cannot push workflow-file mutations. Keep the first-parent
          # workflow tree unchanged; the GitHub App applies the reviewed upstream
          # workflow files immediately after this merge commit is published.
          git checkout "$LOCAL_HEAD_SHA" -- \
            .github/workflows/ci.yml \
            .github/workflows/coverage-badge.yml \
            .github/workflows/release-build.yml \
            .github/workflows/release-please.yml
          git rm -f --ignore-unmatch .github/workflows/docker-runner-image.yml

          git add -A
          git commit -m "merge: sync upstream master and harden window/runner lifecycle [sync-complete]"

      - name: Mark PR and push merge commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --title "[sync-complete] Sync upstream master and fix runner/window stability"
          git push origin HEAD:${{ github.head_ref }} 2>&1 | tee /tmp/merge-push.log

      - name: Upload push diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: merge-push-diagnostic
          path: /tmp/merge-push.log
          if-no-files-found: warn
          retention-days: 1
