name: Execute upstream sync PR

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agent-sync-upstream-stability-pr
  cancel-in-progress: false

jobs:
  sync-fix-test:
    if: ${{ !contains(github.event.pull_request.title, '[sync-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout PR branch with full history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Configure Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Merge upstream and apply fixes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          (
            set -euo pipefail
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            LOCAL_BASE_SHA="$(git merge-base HEAD origin/master)"
            git remote add upstream https://github.com/aGallea/homerun.git
            git fetch upstream master
            git merge --no-commit --no-ff -X theirs upstream/master

            git checkout "$LOCAL_BASE_SHA" -- \
              apps/desktop/src/components/RunnerTable.tsx \
              apps/desktop/src/pages/RunnerDetail.tsx

            SCRIPT_GZIP_B64="$(sed -n 's/^      SCRIPT_GZIP_B64: //p' .github/workflows/agent-sync-upstream.yml)"
            test -n "$SCRIPT_GZIP_B64"
            mkdir -p .github/maintenance
            printf '%s' "$SCRIPT_GZIP_B64" | base64 --decode | gzip --decompress > .github/maintenance/agent_sync_and_fix.py
            python .github/maintenance/agent_sync_and_fix.py
            cargo fmt --all

            rm -rf .github/maintenance
            rm -f .github/workflows/agent-sync-upstream.yml .github/workflows/agent-sync-pr.yml
            git add -A
          ) > /tmp/sync-step.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo '### Upstream sync diagnostic'
              echo
              echo '```text'
              tail -n 120 /tmp/sync-step.log
              echo '```'
            } > /tmp/sync-comment.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/sync-comment.md || true
            cat /tmp/sync-step.log
            exit "$status"
          fi
          cat /tmp/sync-step.log

      - name: Upload sync diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sync-diagnostic
          path: /tmp/sync-step.log
          if-no-files-found: error
          retention-days: 1

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Frontend tests
        working-directory: apps/desktop
        run: npm test

      - name: Frontend build
        working-directory: apps/desktop
        run: npm run build

      - name: Rust workspace tests
        run: cargo test --workspace --all-targets

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev build-essential pkg-config

      - name: Check Tauri Rust application
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Commit verified merge and push
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "merge: sync upstream master and harden window/runner lifecycle [sync-complete]"
          git push origin HEAD:${{ github.head_ref }}
