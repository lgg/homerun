name: Format final declared-surfaces audit

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.number == 20 &&
      github.head_ref == 'audit/final-declared-surfaces-2026-08-01' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/final-declared-surfaces-2026-08-01
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format audited Rust changes
        run: |
          test -e .github/audit/final-format.trigger
          cargo fmt --all
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
          rm .github/audit/final-format.trigger
          git diff --check
      - name: Commit formatting only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/daemon/src/runner/mod.rs crates/daemon/src/scanner/mod.rs crates/tui/src/cli.rs apps/desktop/src-tauri/src/commands.rs crates/tui/src/daemon_lifecycle.rs
          git add -u .github/audit/final-format.trigger
          git commit -m "style: format final audit changes"
          git push origin HEAD:audit/final-declared-surfaces-2026-08-01
