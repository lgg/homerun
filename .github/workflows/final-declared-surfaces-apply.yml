name: Apply final declared-surfaces audit

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.repository == 'lgg/homerun' &&
      github.head_ref == 'audit/final-declared-surfaces-2026-08-01' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/final-declared-surfaces-2026-08-01
          fetch-depth: 0
      - name: Apply audited patch
        run: python3 .github/audit/apply_final_declared_surfaces.py
      - name: Commit product changes only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f --ignore-unmatch .github/audit/apply_final_declared_surfaces.py
          git rm -f --ignore-unmatch .github/workflows/final-declared-surfaces-apply.yml
          git add \
            README.md \
            Cargo.toml \
            apps/desktop/src/components/Layout.tsx \
            apps/desktop/src/components/Layout.test.tsx \
            apps/desktop/src/pages/Settings.tsx \
            apps/desktop/src/pages/Settings.test.tsx \
            apps/desktop/src/pages/Repositories.tsx \
            apps/desktop/src/components/NewRunnerWizard.tsx \
            apps/desktop/src/utils/repository.ts \
            apps/desktop/src/utils/repository.test.ts \
            apps/desktop/src-tauri/capabilities/default.json \
            apps/desktop/src-tauri/src/commands.rs \
            crates/daemon/src/runner/mod.rs \
            crates/daemon/src/scanner/mod.rs \
            crates/tui/src/cli.rs \
            crates/tui/src/daemon_lifecycle.rs
          git diff --cached --check
          git commit -m "fix: correct audit regression placement [skip ci]"
          git push origin HEAD:audit/final-declared-surfaces-2026-08-01
