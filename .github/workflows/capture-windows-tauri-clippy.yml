name: Capture Windows Tauri Clippy

on:
  push:
    branches:
      - fix/runtime-home-runner-display-preferences
    paths:
      - .github/workflows/capture-windows-tauri-clippy.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Capture standalone Tauri clippy
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          & cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings 2>&1 | Tee-Object -FilePath windows-tauri-clippy.txt
          "cargo_exit_code=$LASTEXITCODE" | Add-Content -Path windows-tauri-clippy.txt
          exit 0

      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: windows-tauri-clippy-log
          path: windows-tauri-clippy.txt
          if-no-files-found: error
