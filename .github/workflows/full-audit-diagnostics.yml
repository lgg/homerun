name: Full Audit Frontend Diagnostics

on:
  pull_request:
    branches: [master]
    types: [synchronize, reopened]

permissions:
  contents: read

jobs:
  frontend:
    if: github.event.pull_request.number == 13
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/full-product-function-screen-audit-2026-07-25
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Capture TypeScript diagnostics
        shell: bash
        working-directory: apps/desktop
        run: |
          set +e
          npm exec -- tsc --noEmit > /tmp/tsc.log 2>&1
          echo "$?" > /tmp/tsc.status
          exit 0
      - name: Capture Prettier diagnostics
        shell: bash
        run: |
          set +e
          npx --yes prettier@3.9.5 --check \
            .github/workflows/ci.yml \
            .github/workflows/release-build.yml \
            .github/workflows/full-audit-source.yml \
            apps/desktop/src-tauri/capabilities/default.json \
            apps/desktop/src/api/bridge.test.ts \
            apps/desktop/src/api/commands.ts \
            apps/desktop/src/api/types.ts \
            apps/desktop/src/components/NewRunnerWizard.tsx \
            apps/desktop/src/hooks/useEvents.ts \
            apps/desktop/src/hooks/useNotifications.test.ts \
            apps/desktop/src/hooks/useNotifications.ts \
            apps/desktop/src/hooks/useRepos.ts \
            apps/desktop/src/hooks/useRunners.ts \
            apps/desktop/src/hooks/useScan.test.ts \
            apps/desktop/src/hooks/useScan.ts \
            apps/desktop/src/pages/Repositories.tsx \
            apps/desktop/src/pages/Settings.tsx > /tmp/prettier.log 2>&1
          echo "$?" > /tmp/prettier.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: full-audit-frontend-diagnostics
          path: |
            /tmp/tsc.log
            /tmp/tsc.status
            /tmp/prettier.log
            /tmp/prettier.status
          retention-days: 1
