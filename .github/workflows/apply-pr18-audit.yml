name: PR 18 Final Verification

on:
  pull_request:
    branches: [master]
    types: [synchronize, reopened]

permissions:
  contents: read

jobs:
  ubuntu-verify:
    if: >-
      github.event.pull_request.number == 18 &&
      github.head_ref == 'audit/declared-features-completion-2026-07-31' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Verify clean committed tree
        run: |
          git diff --check
          cargo fmt --all -- --check
          test -z "$(git ls-files apps/desktop/coverage)"
          test ! -e .github/audit/apply_declared_features.py
          test ! -e .github/workflows/declared-features-audit-apply.yml
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Verify frontend
        working-directory: apps/desktop
        run: |
          npm run test:coverage
          npm exec -- tsc --noEmit
          npm run build
      - name: Verify Rust workspace
        run: |
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo build --release -p homerun -p homerund
          ./target/release/homerun --help

  windows-verify:
    if: >-
      github.event.pull_request.number == 18 &&
      github.head_ref == 'audit/declared-features-completion-2026-07-31' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify Windows Rust workspace
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo build --release -p homerun -p homerund
          .\target\release\homerun.exe --help
