name: One-shot shutdown persistence regression test

on:
  push:
    branches:
      - fix/shutdown-lifecycle-barrier-2026-08-28
    paths:
      - .github/workflows/one-shot-shutdown-persistence-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/shutdown-lifecycle-barrier-2026-08-28
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Add persistence barrier regression test
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/daemon/src/runner/mod.rs")
          text = path.read_text()
          marker = '''    #[tokio::test]
              async fn test_shutdown_barrier_rejects_new_starts() {
          '''
          test = '''    #[tokio::test]
              async fn test_shutdown_waits_for_creation_persistence_transaction() {
                  let manager = create_test_manager();
                  let persistence_guard = manager.persistence_lock.lock().await;

                  let create_manager = manager.clone();
                  let create_task = tokio::spawn(async move {
                      create_manager
                          .create("owner/repo", None, None, None, None, None)
                          .await
                  });

                  // create_with_intent acquires lifecycle admission before persistence.
                  // Keep the persistence transaction blocked until that admission lock
                  // is definitely held, then prove shutdown cannot overtake it.
                  tokio::time::timeout(std::time::Duration::from_secs(1), async {
                      loop {
                          if manager.lifecycle_operations.try_lock().is_err() {
                              break;
                          }
                          tokio::task::yield_now().await;
                      }
                  })
                  .await
                  .expect("creation never acquired lifecycle admission");

                  let shutdown_manager = manager.clone();
                  let mut shutdown_task = tokio::spawn(async move {
                      shutdown_manager.begin_shutdown_operation().await
                  });
                  assert!(tokio::time::timeout(
                      std::time::Duration::from_millis(25),
                      &mut shutdown_task,
                  )
                  .await
                  .is_err());

                  drop(persistence_guard);
                  let runner = create_task.await.unwrap().unwrap();
                  assert_eq!(shutdown_task.await.unwrap().unwrap(), 0);
                  assert!(manager.get(&runner.config.id).await.is_some());
              }

          ''' + marker
          count = text.count(marker)
          if count != 1:
              raise SystemExit(f"Expected one shutdown-test marker, found {count}")
          path.write_text(text.replace(marker, test, 1))
      - name: Format Rust changes
        run: cargo fmt --all
      - name: Commit test and remove workflow
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-shutdown-persistence-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: cover shutdown during runner persistence"
          git push origin HEAD:fix/shutdown-lifecycle-barrier-2026-08-28
