name: Delete Integrity Final Validation

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.number == 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/delete-integrity-and-start-admission-2026-07-24
          fetch-depth: 0
      - name: Apply authenticated deletion invariant
        run: |
          python - <<'PY'
          from pathlib import Path

          manager_path = Path('crates/daemon/src/runner/mod.rs')
          manager = manager_path.read_text(encoding='utf-8')
          start = manager.index('    async fn delete_reserved(&self, id: &str) -> Result<()> {')
          end = manager.index('\n    pub async fn update(', start)
          block = manager[start:end]
          guard = '''        self.wait_for_mutations_to_finish(id).await?;
                  let runner = self
                      .get(id)
                      .await
                      .ok_or_else(|| anyhow::anyhow!("Runner not found"))?;
                  if already_configured(&runner.config.work_dir) {
                      bail!(
                          "Authentication required to deregister configured runner before deletion"
                      );
                  }
          '''
          if 'Authentication required to deregister configured runner' not in block:
              opening = '    async fn delete_reserved(&self, id: &str) -> Result<()> {\n'
              block = block.replace(opening, opening + guard, 1)
          manager = manager[:start] + block + manager[end:]

          if 'test_local_delete_rejects_configured_runner_without_changing_intent' not in manager:
              marker = '    #[tokio::test]\n    async fn test_full_delete_skips_remote_api_for_unconfigured_runner() {'
              index = manager.index(marker)
              test = '''    #[tokio::test]
              async fn test_local_delete_rejects_configured_runner_without_changing_intent() {
                  let manager = create_test_manager();
                  let runner = manager
                      .create("owner/repo", None, None, None, None, None)
                      .await
                      .unwrap();
                  let id = runner.config.id.clone();
                  std::fs::write(runner.config.work_dir.join(".runner"), "configured").unwrap();
                  manager.set_desired_running(&id, true).await.unwrap();

                  let error = manager.delete(&id).await.unwrap_err();

                  assert!(error.to_string().contains("Authentication required"));
                  assert!(manager.get(&id).await.is_some());
                  assert!(manager.is_desired_running(&id).await);
              }

          '''
              manager = manager[:index] + test + manager[index:]
          manager_path.write_text(manager, encoding='utf-8')

          runners_path = Path('crates/daemon/src/api/runners.rs')
          runners = runners_path.read_text(encoding='utf-8')
          start = runners.index('pub async fn delete_runner(')
          end = runners.index('\npub async fn start_runner(', start)
          new_function = '''pub async fn delete_runner(
              State(state): State<AppState>,
              Path(id): Path<String>,
          ) -> Result<StatusCode, (StatusCode, String)> {
              state
                  .runner_manager
                  .get(&id)
                  .await
                  .ok_or_else(|| (StatusCode::NOT_FOUND, format!("Runner '{id}' not found")))?;

              let token = state.auth.token().await;
              if let Some(token) = token {
                  state
                      .runner_manager
                      .full_delete(&id, &token)
                      .await
                      .map_err(|error| {
                          (
                              StatusCode::INTERNAL_SERVER_ERROR,
                              format!("Failed to delete runner: {error}"),
                          )
                      })?;
              } else {
                  state.runner_manager.delete(&id).await.map_err(|error| {
                      let message = error.to_string();
                      if message.contains("Authentication required") {
                          (StatusCode::UNAUTHORIZED, message)
                      } else {
                          (StatusCode::INTERNAL_SERVER_ERROR, message)
                      }
                  })?;
              }
              Ok(StatusCode::NO_CONTENT)
          }
          '''
          runners = runners[:start] + new_function + runners[end:]
          if 'test_delete_configured_runner_requires_authentication' not in runners:
              marker = '    #[tokio::test]\n    async fn test_get_runner_not_found() {'
              index = runners.index(marker)
              test = '''    #[tokio::test]
              async fn test_delete_configured_runner_requires_authentication() {
                  let state = AppState::new_test();
                  let runner = state
                      .runner_manager
                      .create("owner/repo", None, None, None, None, None)
                      .await
                      .unwrap();
                  let id = runner.config.id.clone();
                  std::fs::write(runner.config.work_dir.join(".runner"), "configured").unwrap();

                  let app = create_router(state.clone());
                  let response = app
                      .oneshot(
                          Request::builder()
                              .method("DELETE")
                              .uri(format!("/runners/{id}"))
                              .body(Body::empty())
                              .unwrap(),
                      )
                      .await
                      .unwrap();

                  assert_eq!(response.status(), StatusCode::UNAUTHORIZED);
                  assert!(state.runner_manager.get(&id).await.is_some());
              }

          '''
              runners = runners[:index] + test + runners[index:]
          runners_path.write_text(runners, encoding='utf-8')

          groups_path = Path('crates/daemon/src/api/groups.rs')
          groups = groups_path.read_text(encoding='utf-8')
          start = groups.index('pub async fn scale_group(')
          end = groups.index('\npub async fn delete_group(', start)
          block = groups[start:end]
          token_start = block.index('    // Scaling up requires authentication') if '    // Scaling up requires authentication' in block else block.index('    let token = state.auth.token().await;')
          token_end = block.index('\n\n    let response', token_start)
          token_logic = '''    let token = state.auth.token().await;
              let scaling_up = req.count as usize > existing.len();
              let scaling_down = req.count as usize < existing.len();
              if scaling_up && token.is_none() {
                  return Err((
                      StatusCode::UNAUTHORIZED,
                      "No auth token available. Please authenticate first.".to_string(),
                  ));
              }
              if scaling_down
                  && token.is_none()
                  && existing.iter().any(|runner| {
                      runner.config.work_dir.join(".runner").exists()
                          || runner.config.work_dir.join(".runner_migrated").exists()
                  })
              {
                  return Err((
                      StatusCode::UNAUTHORIZED,
                      "Authentication is required to deregister configured runners while scaling down"
                          .to_string(),
                  ));
              }
              if let Some(token) = token.as_ref() {
                  state
                      .runner_manager
                      .set_auth_token(Some(token.to_string()))
                      .await;
              }
          '''
          block = block[:token_start] + token_logic + block[token_end:]
          groups = groups[:start] + block + groups[end:]

          if 'test_scale_down_configured_group_requires_authentication' not in groups:
              marker = '    #[tokio::test]\n    async fn test_list_runners_filter_by_group_id() {'
              index = groups.index(marker)
              test = '''    #[tokio::test]
              async fn test_scale_down_configured_group_requires_authentication() {
                  let state = AppState::new_test();
                  let group_id = "configured-scale-group".to_string();
                  for _ in 0..2 {
                      let runner = state
                          .runner_manager
                          .create(
                              "owner/repo",
                              None,
                              None,
                              None,
                              Some(group_id.clone()),
                              None,
                          )
                          .await
                          .unwrap();
                      std::fs::write(runner.config.work_dir.join(".runner"), "configured").unwrap();
                  }

                  let app = create_router(state.clone());
                  let response = app
                      .oneshot(
                          Request::builder()
                              .method("PATCH")
                              .uri(format!("/runners/groups/{group_id}"))
                              .header("content-type", "application/json")
                              .body(Body::from(r#"{"count":1}"#))
                              .unwrap(),
                      )
                      .await
                      .unwrap();

                  assert_eq!(response.status(), StatusCode::UNAUTHORIZED);
                  assert_eq!(state.runner_manager.list_by_group(&group_id).await.len(), 2);
              }

          '''
              groups = groups[:index] + test + groups[index:]
          groups_path.write_text(groups, encoding='utf-8')
          PY
          cargo fmt --all
          git diff --check
      - name: Publish invariant fixes when needed
        run: |
          if git diff --quiet; then
            echo "No invariant fix required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/daemon/src/runner/mod.rs crates/daemon/src/api/runners.rs crates/daemon/src/api/groups.rs
          git commit -m "fix: require authentication before deleting configured runners"
          git push origin HEAD:audit/delete-integrity-and-start-admission-2026-07-24

  linux:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/delete-integrity-and-start-admission-2026-07-24
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Frontend tests
        working-directory: apps/desktop
        run: npm test
      - name: Type check
        working-directory: apps/desktop
        run: npm exec -- tsc --noEmit
      - name: Frontend production build
        working-directory: apps/desktop
        run: npm run build
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust workspace tests
        run: cargo test --workspace --all-targets
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Release daemon build
        run: cargo build -p homerund --release
      - name: Prepare Tauri sidecar
        working-directory: apps/desktop
        run: npm run prepare-sidecar
      - name: Linux Tauri check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets

  windows:
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/delete-integrity-and-start-admission-2026-07-24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Frontend tests
        working-directory: apps/desktop
        run: npm test
      - name: Type check
        working-directory: apps/desktop
        run: npm exec -- tsc --noEmit
      - name: Frontend production build
        working-directory: apps/desktop
        run: npm run build
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust workspace tests
        run: cargo test --workspace --all-targets
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Release daemon build
        run: cargo build -p homerund --release
      - name: Prepare Tauri sidecar
        working-directory: apps/desktop
        run: npm run prepare-sidecar
      - name: Windows Tauri check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
