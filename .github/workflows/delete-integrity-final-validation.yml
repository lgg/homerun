name: Delete Integrity Final Validation

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.number == 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/delete-integrity-and-start-admission-2026-07-24
          fetch-depth: 0
      - name: Apply final reviewed event ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/daemon/src/runner/mod.rs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '''    async fn delete_reserved(&self, id: &str) -> Result<()> {
                      self.prepare_delete_reserved(id).await?;
                      self.emit_state_event(id, "deleting");
                      self.remove_reserved(id).await
                  }
                  ''',
                  '''    async fn delete_reserved(&self, id: &str) -> Result<()> {
                      self.prepare_delete_reserved(id).await?;
                      self.remove_reserved(id).await?;
                      self.emit_state_event(id, "deleting");
                      Ok(())
                  }
                  ''',
              ),
              (
                  '''        let runner = self
                      .get(id)
                      .await
                      .ok_or_else(|| anyhow::anyhow!("Runner not found"))?;
                  self.emit_state_event(id, "deleting");

                  // Only configured runners have a GitHub registration to remove. Use the
                  ''',
                  '''        let runner = self
                      .get(id)
                      .await
                      .ok_or_else(|| anyhow::anyhow!("Runner not found"))?;

                  // Only configured runners have a GitHub registration to remove. Use the
                  ''',
              ),
              (
                  '''        self.remove_reserved(id).await
              }
              ''',
                  '''        self.remove_reserved(id).await?;
                  self.emit_state_event(id, "deleting");
                  Ok(())
              }
              ''',
              ),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise RuntimeError('unexpected deletion flow shape')
          path.write_text(text, encoding='utf-8')
          trigger = Path('.github/delete-integrity-review-trigger')
          if trigger.exists():
              trigger.unlink()
          PY
          cargo fmt --all
          git diff --check
      - name: Publish review fix when needed
        run: |
          if git diff --quiet; then
            echo "No review fix required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/daemon/src/runner/mod.rs .github/delete-integrity-review-trigger
          git commit -m "fix: publish deletion event only after durable removal"
          git push origin HEAD:audit/delete-integrity-and-start-admission-2026-07-24

  linux:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/delete-integrity-and-start-admission-2026-07-24
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Frontend tests
        working-directory: apps/desktop
        run: npm test
      - name: Type check
        working-directory: apps/desktop
        run: npm exec -- tsc --noEmit
      - name: Frontend production build
        working-directory: apps/desktop
        run: npm run build
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust workspace tests
        run: cargo test --workspace --all-targets
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Release daemon build
        run: cargo build -p homerund --release
      - name: Linux Tauri check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets

  windows:
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/delete-integrity-and-start-admission-2026-07-24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Frontend tests
        working-directory: apps/desktop
        run: npm test
      - name: Type check
        working-directory: apps/desktop
        run: npm exec -- tsc --noEmit
      - name: Frontend production build
        working-directory: apps/desktop
        run: npm run build
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust workspace tests
        run: cargo test --workspace --all-targets
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Release daemon build
        run: cargo build -p homerund --release
      - name: Windows Tauri check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
