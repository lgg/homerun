name: One-shot failed daemon process tree cleanup

on:
  push:
    branches:
      - fix/daemon-start-child-cleanup-2026-08-28
    paths:
      - .github/workflows/one-shot-daemon-start-tree-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/daemon-start-child-cleanup-2026-08-28
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply process-tree cleanup
        shell: python
        run: |
          import re
          from pathlib import Path

          p = Path("crates/tui/src/daemon_lifecycle.rs")
          text = p.read_text()

          def sub_once(pattern, replacement):
              global text
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Expected one regex match, found {count}: {pattern[:120]!r}")
              text = updated

          sub_once(
              r"#\[cfg\(unix\)\]\nuse std::path::\{Path, PathBuf\};\nuse std::process::\{Child, Stdio\};",
              '''#[cfg(unix)]
              use std::os::unix::process::CommandExt;
              #[cfg(unix)]
              use std::path::{Path, PathBuf};
              use std::process::{Child, Command, Stdio};''',
          )

          sub_once(
              r"fn terminate_spawned_daemon\(child: &mut Child\) -> Result<\(\)> \{.*?\n\}\n\n#\[cfg\(unix\)\]\nfn socket_path_from_home",
              '''#[cfg(unix)]
              fn configure_spawned_daemon(command: &mut Command) {
                  // Give the daemon its own process group so failed startup cleanup can
                  // terminate any runner children it spawned before becoming healthy.
                  command.process_group(0);
              }

              #[cfg(windows)]
              fn configure_spawned_daemon(_command: &mut Command) {}

              #[cfg(unix)]
              fn terminate_daemon_process_tree(child: &mut Child) -> Result<()> {
                  let pid = child.id() as i32;
                  unsafe extern "C" {
                      fn kill(pid: i32, sig: i32) -> i32;
                  }
                  let result = unsafe { kill(-pid, 9) };
                  if result != 0
                      && child
                          .try_wait()
                          .context("Failed to inspect homerund after process-group cleanup")?
                          .is_none()
                  {
                      return Err(std::io::Error::last_os_error())
                          .context("Failed to terminate timed-out homerund process group");
                  }
                  Ok(())
              }

              #[cfg(windows)]
              fn terminate_daemon_process_tree(child: &mut Child) -> Result<()> {
                  let pid = child.id().to_string();
                  let status = Command::new("taskkill")
                      .args(["/T", "/F", "/PID", &pid])
                      .stdin(Stdio::null())
                      .stdout(Stdio::null())
                      .stderr(Stdio::null())
                      .status()
                      .context("Failed to invoke taskkill for timed-out homerund process tree")?;
                  if !status.success()
                      && child
                          .try_wait()
                          .context("Failed to inspect homerund after taskkill")?
                          .is_none()
                  {
                      bail!("taskkill failed to terminate timed-out homerund process tree");
                  }
                  Ok(())
              }

              fn terminate_spawned_daemon(child: &mut Child) -> Result<()> {
                  if child
                      .try_wait()
                      .context("Failed to inspect spawned homerund process")?
                      .is_some()
                  {
                      return Ok(());
                  }
                  terminate_daemon_process_tree(child)?;
                  child
                      .wait()
                      .context("Failed to reap timed-out homerund process")?;
                  Ok(())
              }

              #[cfg(unix)]
              fn socket_path_from_home''',
          )

          sub_once(
              r'''    let binary = which::which\("homerund"\).*?        \.context\("Failed to spawn homerund"\)\?;''',
              '''    let binary = which::which("homerund")
                  .context("homerund not found in PATH. Install it or add it to your PATH.")?;
              let mut command = Command::new(&binary);
              configure_spawned_daemon(&mut command);
              let mut child = command
                  .stdin(Stdio::null())
                  .stdout(Stdio::null())
                  .stderr(Stdio::null())
                  .spawn()
                  .context("Failed to spawn homerund")?;''',
          )

          marker = '''    #[cfg(unix)]
              #[test]
              fn socket_path_requires_home_directory() {
          '''
          if text.count(marker) != 1:
              raise SystemExit("socket-path test marker missing or duplicated")
          test = '''    #[test]
              fn cleanup_terminates_running_child() {
                  #[cfg(unix)]
                  let mut command = {
                      let mut command = Command::new("sh");
                      command.args(["-c", "sleep 30"]);
                      configure_spawned_daemon(&mut command);
                      command
                  };
                  #[cfg(windows)]
                  let mut command = {
                      let mut command = Command::new("cmd");
                      command.args(["/C", "ping -n 30 127.0.0.1 >NUL"]);
                      configure_spawned_daemon(&mut command);
                      command
                  };
                  let mut child = command
                      .stdin(Stdio::null())
                      .stdout(Stdio::null())
                      .stderr(Stdio::null())
                      .spawn()
                      .unwrap();
                  terminate_spawned_daemon(&mut child).unwrap();
                  assert!(child.try_wait().unwrap().is_some());
              }

          '''
          text = text.replace(marker, test + marker, 1)
          p.write_text(text)

      - name: Format Rust changes
        run: cargo fmt --all
      - name: Commit hardening and remove workflow
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-daemon-start-tree-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: terminate failed daemon process trees"
          git push origin HEAD:fix/daemon-start-child-cleanup-2026-08-28
