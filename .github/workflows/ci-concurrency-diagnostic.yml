name: CI Concurrency Diagnostic

on:
  pull_request:
    branches: [master]
    types: [reopened]

permissions:
  contents: read

concurrency:
  group: homerun-ci-diagnostic-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  parse:
    if: github.event.pull_request.number == 12
    runs-on: ubuntu-latest
    steps:
      - run: echo "concurrency syntax accepted"
