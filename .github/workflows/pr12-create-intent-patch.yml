name: PR 12 Create Intent Patch

on:
  pull_request:
    branches: [master]
    types: [reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 12
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/delete-integrity-and-start-admission-2026-07-24
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply reviewed create-intent patch
        run: |
          git fetch origin master
          git show origin/master:scripts/pr12_create_intent_patch.py > /tmp/apply.py
          python /tmp/apply.py
          sed -i 's/let mut reserved = Vec::with_capacity/let mut reserved: Vec<String> = Vec::with_capacity/g' crates/daemon/src/api/groups.rs
          cargo fmt --all
          git diff --check
      - name: Capture focused daemon tests
        shell: bash
        run: |
          set +e
          cargo test -p homerund --lib > /tmp/create-intent-tests.log 2>&1
          echo "$?" > /tmp/create-intent-tests.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr12-create-intent-tests
          path: |
            /tmp/create-intent-tests.log
            /tmp/create-intent-tests.status
          retention-days: 1
      - name: Verify focused daemon tests
        run: |
          status=$(cat /tmp/create-intent-tests.status)
          if [[ "$status" != "0" ]]; then
            grep -nE 'error\[|error:|FAILED|panicked at|failures:' /tmp/create-intent-tests.log || true
            tail -n 200 /tmp/create-intent-tests.log
          fi
          exit "$status"
      - name: Commit reviewed patch
        run: |
          if git diff --quiet; then
            echo "Create-intent patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/daemon/src/runner/mod.rs crates/daemon/src/api/runners.rs crates/daemon/src/api/groups.rs crates/daemon/src/runner/process.rs
          git commit -m "fix: persist creation intent before publishing runners"
          git push origin HEAD:audit/delete-integrity-and-start-admission-2026-07-24
