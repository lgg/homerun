name: PR 12 Create Intent Patch

on:
  pull_request:
    branches: [master]
    types: [reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 12
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/delete-integrity-and-start-admission-2026-07-24
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply reviewed create-intent patch
        run: |
          git fetch origin master
          git show origin/master:scripts/pr12_create_intent_patch.py > /tmp/apply.py
          python /tmp/apply.py
          cargo fmt --all
          git diff --check
      - name: Verify focused daemon tests
        run: cargo test -p homerund --lib
      - name: Commit reviewed patch
        run: |
          if git diff --quiet; then
            echo "Create-intent patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/daemon/src/runner/mod.rs crates/daemon/src/api/runners.rs crates/daemon/src/api/groups.rs crates/daemon/src/runner/process.rs
          git commit -m "fix: persist creation intent before publishing runners"
          git push origin HEAD:audit/delete-integrity-and-start-admission-2026-07-24
