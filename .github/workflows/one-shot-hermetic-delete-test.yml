name: One-shot hermetic delete test

on:
  push:
    branches:
      - "test/hermetic-delete-endpoint-2026-08-28"
    paths:
      - ".github/workflows/one-shot-hermetic-delete-test.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Make delete endpoint test hermetic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/daemon/src/api/runners.rs")
          text = path.read_text()
          test_anchor = "    async fn test_delete_runner() {"
          start_marker = "        // Create\n"
          end_marker = "        // Delete\n"

          test_pos = text.find(test_anchor)
          if test_pos < 0:
              raise SystemExit("delete test anchor not found")
          start = text.find(start_marker, test_pos)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("delete test setup markers not found")

          replacement = '''        // Seed an unconfigured runner directly. Creating through POST /runners
          // intentionally starts registration in the background, which makes this
          // DELETE endpoint test depend on runner downloads and GitHub network timing.
          let runner = state
              .runner_manager
              .create("aGallea/gifted", None, None, None, None, None)
              .await
              .unwrap();
          let id = runner.config.id;

          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Format and verify targeted test
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --locked -p homerund api::runners::tests::test_delete_runner -- --exact

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-hermetic-delete-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: isolate delete endpoint from runner startup"
          git push origin HEAD:test/hermetic-delete-endpoint-2026-08-28
