name: Full Audit Frontend Quality Fix

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 13
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/full-product-function-screen-audit-2026-07-25
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Apply final frontend quality fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          layout = Path('apps/desktop/src/components/Layout.tsx')
          source = layout.read_text()
          old = '''  useEffect(() => {\n    const unlisten = listen<string>("navigate", (event) => {\n      navigate(event.payload);\n    });\n    return () => {\n      unlisten.then((fn) => fn());\n    };\n  }, [navigate]);\n'''
          new = '''  useEffect(() => {\n    let disposed = false;\n    let removeListener: (() => void) | undefined;\n\n    try {\n      void listen<string>("navigate", (event) => {\n        if (!disposed) navigate(event.payload);\n      })\n        .then((unlisten) => {\n          if (disposed) unlisten();\n          else removeListener = unlisten;\n        })\n        .catch(() => {\n          // Browser previews and unit tests do not provide a Tauri event bridge.\n        });\n    } catch {\n      // Treat a synchronously unavailable bridge like an unavailable stream.\n    }\n\n    return () => {\n      disposed = true;\n      removeListener?.();\n    };\n  }, [navigate]);\n'''
          if old in source:
              source = source.replace(old, new, 1)
          layout.write_text(source)

          tray = Path('apps/desktop/src/pages/TrayPanel.tsx')
          source = tray.read_text()
          old = '''  const counts = { online: 0, busy: 0, offline: 0 };\n  for (const r of runners) {\n    if (r.state === "busy") counts.busy++;\n    else if (r.state === "offline" || r.state === "error") counts.offline++;\n    else counts.online++;\n  }\n'''
          new = '''  const counts = { online: 0, busy: 0, offline: 0, transitioning: 0 };\n  for (const runner of runners) {\n    if (runner.state === "busy") counts.busy++;\n    else if (runner.state === "online") counts.online++;\n    else if (runner.state === "offline" || runner.state === "error") counts.offline++;\n    else counts.transitioning++;\n  }\n'''
          if old in source:
              source = source.replace(old, new, 1)
          marker = '''        <span>\n          <strong className="tray-muted">{counts.offline}</strong>{" "}\n          <span className="tray-muted">offline</span>\n        </span>\n'''
          addition = marker + '''        {counts.transitioning > 0 && (\n          <span>\n            <strong style={{ color: "var(--accent-blue)" }}>{counts.transitioning}</strong>{" "}\n            <span className="tray-muted">starting/stopping</span>\n          </span>\n        )}\n'''
          if marker in source and 'counts.transitioning > 0' not in source:
              source = source.replace(marker, addition, 1)
          tray.write_text(source)

          settings = Path('apps/desktop/src/pages/Settings.tsx')
          source = settings.read_text()
          source = source.replace(
              '    getVersion().then(setAppVersion);',
              '    getVersion().then(setAppVersion).catch(() => setAppVersion("unknown"));',
              1,
          )
          settings.write_text(source)
          PY
      - name: Add Node test declarations
        working-directory: apps/desktop
        run: npm install --save-dev @types/node@24 --package-lock-only
      - name: Install updated frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Format changed frontend files
        run: |
          npx --yes prettier@3.9.5 --write \
            apps/desktop/src/components/Layout.tsx \
            apps/desktop/src/hooks/useScan.ts \
            apps/desktop/src/pages/Repositories.tsx \
            apps/desktop/src/pages/Settings.tsx \
            apps/desktop/src/pages/TrayPanel.tsx
          git diff --check
      - name: Verify frontend suite and types
        working-directory: apps/desktop
        run: |
          npm test
          npm exec -- tsc --noEmit
          npm run build
      - name: Commit final frontend fixes
        run: |
          if git diff --quiet; then
            echo 'Final frontend fixes are already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/desktop/package.json \
            apps/desktop/package-lock.json \
            apps/desktop/src/components/Layout.tsx \
            apps/desktop/src/hooks/useScan.ts \
            apps/desktop/src/pages/Repositories.tsx \
            apps/desktop/src/pages/Settings.tsx \
            apps/desktop/src/pages/TrayPanel.tsx
          git commit -m 'fix: harden desktop event and tray state handling'
          git push origin HEAD:audit/full-product-function-screen-audit-2026-07-25
