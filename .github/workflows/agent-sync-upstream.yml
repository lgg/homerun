name: One-shot upstream sync and stability fixes

on:
  push:
    branches:
      - agent/sync-upstream-stability-2026-07-24

permissions:
  contents: write

concurrency:
  group: agent-sync-upstream-stability
  cancel-in-progress: false

jobs:
  sync-fix-test:
    if: ${{ !contains(github.event.head_commit.message, '[sync-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SCRIPT_GZIP_B64: 

    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure toolchains
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Merge upstream and apply fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          LOCAL_BASE_SHA="$(git rev-parse HEAD^)"
          git remote add upstream https://github.com/aGallea/homerun.git
          git fetch upstream master
          git merge --no-commit --no-ff -X theirs upstream/master

          # Preserve the fork's local display-name UX, then add upstream Docker UI to it.
          git checkout "$LOCAL_BASE_SHA" -- \
            apps/desktop/src/components/RunnerTable.tsx \
            apps/desktop/src/pages/RunnerDetail.tsx

          mkdir -p .github/maintenance
          printf '%s' "$SCRIPT_GZIP_B64" | base64 --decode | gzip --decompress > .github/maintenance/agent_sync_and_fix.py
          python .github/maintenance/agent_sync_and_fix.py
          cargo fmt --all

          # This is a one-shot workflow; keep the resulting branch clean.
          rm -rf .github/maintenance
          rm -f .github/workflows/agent-sync-upstream.yml
          git add -A

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Frontend tests
        working-directory: apps/desktop
        run: npm test

      - name: Frontend build
        working-directory: apps/desktop
        run: npm run build

      - name: Rust workspace tests
        run: cargo test --workspace --all-targets

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            pkg-config

      - name: Check Tauri Rust application
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Commit verified merge and push
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "merge: sync upstream master and harden window/runner lifecycle [sync-complete]"
          git push origin HEAD:agent/sync-upstream-stability-2026-07-24
