name: Agent refresh release prep status

on:
  push:
    branches:
      - agent/inspect-release-prep-run

permissions:
  contents: write
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/inspect-release-prep-run
      - name: Refresh latest prep workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RUN_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/agent-prepare-v0.8.5.yml/runs?branch=agent%2Frelease-v0.8.5&per_page=1")
          echo "$RUN_JSON" | jq '.workflow_runs[0] | {id,status,conclusion,head_sha,event,html_url,created_at,updated_at}' > .prep-run-status.txt
          RUN_ID=$(echo "$RUN_JSON" | jq -r '.workflow_runs[0].id')
          if [[ "$RUN_ID" != "null" ]]; then
            echo >> .prep-run-status.txt
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
              --jq '.jobs[] | {id,name,status,conclusion,steps}' >> .prep-run-status.txt
          fi
      - name: Commit report and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/agent-refresh-prep-status.yml
          git add .prep-run-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh release prep run status"
          git push origin HEAD:agent/inspect-release-prep-run
