name: Fix TUI login socket handling

on:
  push:
    branches:
      - fix/runtime-home-runner-display-preferences

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply TUI login socket fix
        run: python3 .github/fix_tui_login_socket.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Remove one-shot files
        run: rm .github/fix_tui_login_socket.py .github/workflows/fix-tui-login-socket.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: handle missing TUI login socket path"
          git push origin HEAD:${GITHUB_REF_NAME}
