name: Post-merge Clean Final Validation

on:
  pull_request:
    branches: [master]
    types: [reopened]

permissions:
  contents: read

jobs:
  linux:
    if: ${{ github.head_ref == 'audit/post-merge-transactional-lifecycle-2026-07-24' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/post-merge-transactional-lifecycle-2026-07-24
      - name: Verify unsafe helper was removed
        run: |
          ! grep -R "register_and_start_from_registering" crates --include='*.rs'
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - working-directory: apps/desktop
        run: npm ci
      - working-directory: apps/desktop
        run: npm test
      - working-directory: apps/desktop
        run: npm exec -- tsc --noEmit
      - working-directory: apps/desktop
        run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Linux Tauri check
        run: |
          cargo build --release -p homerund
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/homerund apps/desktop/src-tauri/binaries/homerund-x86_64-unknown-linux-gnu
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  windows:
    if: ${{ github.head_ref == 'audit/post-merge-transactional-lifecycle-2026-07-24' }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/post-merge-transactional-lifecycle-2026-07-24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - working-directory: apps/desktop
        run: npm ci
      - working-directory: apps/desktop
        run: npm test
      - working-directory: apps/desktop
        run: npm exec -- tsc --noEmit
      - working-directory: apps/desktop
        run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Windows Tauri check
        shell: pwsh
        run: |
          cargo build --release -p homerund
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/binaries
          Copy-Item target/release/homerund.exe apps/desktop/src-tauri/binaries/homerund-x86_64-pc-windows-msvc.exe
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
