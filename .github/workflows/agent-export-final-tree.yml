name: Export verified final merge tree

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: agent-export-final-merge-tree
  cancel-in-progress: true

jobs:
  export-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch with full history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Configure Rust formatter
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare exact final source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LOCAL_HEAD_SHA="$(git rev-parse HEAD)"
          LOCAL_BASE_SHA="$(git merge-base HEAD origin/master)"
          git remote add upstream https://github.com/aGallea/homerun.git
          git fetch upstream master
          UPSTREAM_SHA="$(git rev-parse upstream/master)"
          UPSTREAM_TREE_SHA="$(git rev-parse upstream/master^{tree})"

          git archive --format=tar upstream/master | gzip -9 > /tmp/upstream-source.tar.gz
          git merge --no-commit --no-ff -X theirs upstream/master
          git checkout "$LOCAL_BASE_SHA" -- \
            apps/desktop/src/components/RunnerTable.tsx \
            apps/desktop/src/pages/RunnerDetail.tsx
          git apply --check .github/maintenance/homerun-source-fixes.patch
          git apply .github/maintenance/homerun-source-fixes.patch
          cargo fmt --all

          rm -f \
            .github/maintenance/homerun-source-fixes.patch \
            .github/workflows/agent-sync-upstream.yml \
            .github/workflows/agent-sync-pr.yml \
            .github/workflows/agent-export-final-tree.yml
          rmdir .github/maintenance 2>/dev/null || true

          tar --exclude=.git --exclude=target --exclude=node_modules --exclude=apps/desktop/dist \
            -czf /tmp/final-source.tar.gz .
          {
            echo "local_head_sha=$LOCAL_HEAD_SHA"
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "upstream_tree_sha=$UPSTREAM_TREE_SHA"
          } > /tmp/merge-metadata.txt

      - name: Upload source trees
        uses: actions/upload-artifact@v4
        with:
          name: verified-final-merge-tree
          path: |
            /tmp/final-source.tar.gz
            /tmp/upstream-source.tar.gz
            /tmp/merge-metadata.txt
          if-no-files-found: error
          retention-days: 1
