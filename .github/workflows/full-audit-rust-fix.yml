name: Full Audit Rust Fix

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 13
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/full-product-function-screen-audit-2026-07-25
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply exact TUI fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('crates/tui/src/main.rs')
          text = path.read_text()
          changed = False

          old_ws = 'start_ws_forwarding(event_tx, ws_read);'
          new_ws = 'start_ws_forwarding(event_tx.clone(), ws_read);'
          if old_ws in text:
              text = text.replace(old_ws, new_ws, 1)
              changed = True
          elif new_ws not in text:
              raise SystemExit('WebSocket sender pattern not found')

          new_logs = '''        Action::LoadRunnerLogs(id) => client.get_runner_logs(id).await.map(|logs| {
              app.runner_logs = logs;
              app.show_runner_logs = true;
          }),'''
          pattern = re.compile(
              r'        Action::LoadRunnerLogs\(id\) => \{\n'
              r'\s*app\.runner_logs = client\.get_runner_logs\(id\)\.await\?;\n'
              r'\s*app\.show_runner_logs = true;\n'
              r'\s*Ok\(\(\)\)\n'
              r'\s*\}',
          )
          text, count = pattern.subn(new_logs, text, count=1)
          if count == 1:
              changed = True
          elif new_logs not in text:
              raise SystemExit('LoadRunnerLogs pattern not found')

          if changed:
              path.write_text(text)
          PY
          cargo fmt --all
          git diff --check
      - name: Verify Rust workspace
        run: |
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'TUI fixes already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898241+github-actions[bot]@users.noreply.github.com'
          git add crates/tui/src/main.rs
          git commit -m 'fix: resolve final TUI compile regressions'
          git push origin HEAD:audit/full-product-function-screen-audit-2026-07-25
