name: Coverage README patcher

"on":
  push:
    branches:
      - audit/coverage-badge-integrity-2026-08-11

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/coverage-badge-integrity-2026-08-11
          fetch-depth: 0

      - name: Replace stale external coverage badge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          readme = Path("README.md")
          text = readme.read_text()
          old = '  <img src="https://img.shields.io/endpoint?url=https://gist.githubusercontent.com/aGallea/77f18f115b500bdc5d6df52f95d399b9/raw/coverage.json" alt="Coverage" />'
          new = '  <a href="https://github.com/lgg/homerun/actions/workflows/coverage-badge.yml">\n    <img src="https://github.com/lgg/homerun/actions/workflows/coverage-badge.yml/badge.svg?branch=master" alt="Coverage" />\n  </a>'
          if text.count(old) != 1:
              raise SystemExit("stale README coverage badge not found exactly once")
          readme.write_text(text.replace(old, new, 1))
          PY
          grep -q 'actions/workflows/coverage-badge.yml/badge.svg?branch=master' README.md
          ! grep -q 'gist.githubusercontent.com/aGallea' README.md

      - name: Commit README fix and remove patcher
        run: |
          set -euo pipefail
          git rm .github/workflows/coverage-integrity-patcher.yml
          git add README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: make coverage badge repository-native"
          git push origin HEAD:audit/coverage-badge-integrity-2026-08-11
