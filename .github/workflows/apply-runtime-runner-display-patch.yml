name: Apply runtime and runner display patch

on:
  push:
    branches:
      - fix/runtime-home-runner-display-preferences

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited patch
        run: python3 .github/apply_runtime_runner_display_patch.py
      - name: Commit audited changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add runner display preferences and harden runtime paths"
          git push origin HEAD:${GITHUB_REF_NAME}
