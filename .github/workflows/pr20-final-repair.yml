name: PR 20 final audited repair

on:
  pull_request:
    branches: [master]
    types: [reopened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 20 &&
      github.head_ref == 'audit/final-declared-surfaces-2026-08-01' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/final-declared-surfaces-2026-08-01
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Detect pending repair
        id: pending
        shell: bash
        run: |
          if [[ -f .github/workflows/apply-job-context-generation-fix.yml ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply audited source repairs
        if: steps.pending.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return updated

          runner_path = Path("crates/daemon/src/runner/mod.rs")
          runner = runner_path.read_text()
          runner = replace_once(
              runner,
              r'''fn should_apply_job_context\(\n\s*state: &RunnerState,\n\s*current_job: Option<&str>,\n\s*has_context: bool,\n\s*expected_job: &str,\n\) -> bool \{\n\s*\*state == RunnerState::Busy && current_job == Some\(expected_job\) && !has_context\n\}''',
              '''fn should_apply_job_context(
              state: &RunnerState,
              current_job: Option<&str>,
              current_job_started_at: Option<&chrono::DateTime<chrono::Utc>>,
              has_context: bool,
              expected_job: &str,
              expected_job_started_at_micros: i64,
          ) -> bool {
              *state == RunnerState::Busy
                  && current_job == Some(expected_job)
                  && current_job_started_at.map(|started_at| started_at.timestamp_micros())
                      == Some(expected_job_started_at_micros)
                  && !has_context
          }''',
              "job-context guard",
          )

          old = "let needs_context: Vec<(String, String, String, String, String)> = {"
          new = "let needs_context: Vec<(String, String, String, String, String, i64)> = {"
          if runner.count(old) != 1:
              raise SystemExit(f"needs-context tuple: expected one match, found {runner.count(old)}")
          runner = runner.replace(old, new, 1)

          runner = replace_once(
              runner,
              r'''r\.state == RunnerState::Busy\n\s*&& r\.job_context\.is_none\(\)\n\s*&& r\.current_job\.is_some\(\)''',
              '''r.state == RunnerState::Busy
                                  && r.job_context.is_none()
                                  && r.current_job.is_some()
                                  && r.job_started_at.is_some()''',
              "job-context candidate filter",
          )
          runner = replace_once(
              runner,
              r'''r\.config\.repo_name\.clone\(\),\n\s*r\.current_job\.clone\(\)\.unwrap\(\),\n\s*\)''',
              '''r.config.repo_name.clone(),
                                  r.current_job.clone().unwrap(),
                                  r.job_started_at
                                      .as_ref()
                                      .expect("filtered job start timestamp")
                                      .timestamp_micros(),
                              )''',
              "job-context candidate generation",
          )

          old = "for (runner_id, runner_name, owner, repo, job_name) in needs_context {"
          new = "for (runner_id, runner_name, owner, repo, job_name, job_started_at_micros) in needs_context {"
          if runner.count(old) != 1:
              raise SystemExit(f"job-context loop: expected one match, found {runner.count(old)}")
          runner = runner.replace(old, new, 1)

          runner = replace_once(
              runner,
              r'''&runner\.state,\n\s*runner\.current_job\.as_deref\(\),\n\s*runner\.job_context\.is_some\(\),\n\s*&job_name,\n\s*\)''',
              '''&runner.state,
                                      runner.current_job.as_deref(),
                                      runner.job_started_at.as_ref(),
                                      runner.job_context.is_some(),
                                      &job_name,
                                      job_started_at_micros,
                                  )''',
              "job-context compare-and-set call",
          )

          marker = "    #[test]\n    fn test_job_context_compare_and_set_rejects_stale_results() {"
          start = runner.find(marker)
          if start < 0:
              raise SystemExit("job-context regression test: marker not found")
          brace = runner.find("{", start)
          depth = 0
          end = None
          for index in range(brace, len(runner)):
              if runner[index] == "{":
                  depth += 1
              elif runner[index] == "}":
                  depth -= 1
                  if depth == 0:
                      end = index + 1
                      break
          if end is None:
              raise SystemExit("job-context regression test: closing brace not found")
          replacement_test = '''    #[test]
              fn test_job_context_compare_and_set_rejects_stale_results() {
                  let started_at = chrono::Utc::now();
                  let stale_started_at = started_at - chrono::Duration::seconds(1);
                  let expected_micros = started_at.timestamp_micros();

                  assert!(should_apply_job_context(
                      &RunnerState::Busy,
                      Some("build"),
                      Some(&started_at),
                      false,
                      "build",
                      expected_micros,
                  ));
                  assert!(!should_apply_job_context(
                      &RunnerState::Online,
                      None,
                      None,
                      false,
                      "build",
                      expected_micros,
                  ));
                  assert!(!should_apply_job_context(
                      &RunnerState::Busy,
                      Some("test"),
                      Some(&started_at),
                      false,
                      "build",
                      expected_micros,
                  ));
                  assert!(!should_apply_job_context(
                      &RunnerState::Busy,
                      Some("build"),
                      Some(&stale_started_at),
                      false,
                      "build",
                      expected_micros,
                  ));
                  assert!(!should_apply_job_context(
                      &RunnerState::Busy,
                      Some("build"),
                      Some(&started_at),
                      true,
                      "build",
                      expected_micros,
                  ));
              }'''
          runner_path.write_text(runner[:start] + replacement_test + runner[end:])

          scanner_path = Path("crates/daemon/src/scanner/mod.rs")
          scanner = scanner_path.read_text()
          scanner = replace_once(
              scanner,
              r'''let candidate = if let Some\(rest\) = url\.strip_prefix\("git@github\.com:"\) \{\n\s*rest\n\s*\} else if let Some\(rest\) = url\n\s*\.strip_prefix\("https://github\.com/"\)\n\s*\.or_else\(\|\| url\.strip_prefix\("http://github\.com/"\)\)\n\s*\.or_else\(\|\| url\.strip_prefix\("ssh://git@github\.com/"\)\)\n\s*\{\n\s*rest\n\s*\} else \{\n\s*return None;\n\s*\};''',
              '''let candidate = if let Some(rest) = url.strip_prefix("git@github.com:") {
              rest
          } else {
              url.strip_prefix("https://github.com/")
                  .or_else(|| url.strip_prefix("http://github.com/"))
                  .or_else(|| url.strip_prefix("ssh://git@github.com/"))?
          };''',
              "GitHub remote parser",
          )
          scanner_path.write_text(scanner)
          PY

      - name: Validate repaired source strictly
        if: steps.pending.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          cargo test -p homerund test_job_context_compare_and_set_rejects_stale_results
          cargo test -p homerund test_parse_github_url_requires_exact_owner_and_repo
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Commit repair and consume branch helper
        if: steps.pending.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-job-context-generation-fix.yml
          git add crates/daemon/src/runner/mod.rs crates/daemon/src/scanner/mod.rs
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: finish generation-safe audit repairs"
          git push origin HEAD:audit/final-declared-surfaces-2026-08-01
