name: One-shot shutdown lifecycle barrier hardening

on:
  push:
    branches:
      - fix/shutdown-lifecycle-barrier-2026-08-28
    paths:
      - .github/workflows/one-shot-shutdown-barrier-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/shutdown-lifecycle-barrier-2026-08-28
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Harden manager barrier
        shell: python
        run: |
          import re
          from pathlib import Path

          path = Path("crates/daemon/src/runner/mod.rs")
          text = path.read_text()

          def sub_once(pattern, replacement):
              global text
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Expected one regex match, found {count}: {pattern[:120]!r}")
              text = updated

          sub_once(
              r"        let mut creation_operations = if desired \{.*?        \};\n\n        let _persistence_guard",
              '''        // Every creation participates in the lifecycle barrier so shutdown
              // cannot race a persistence transaction. Desired-running creation also
              // reserves its start before releasing this mutex.
              let mut creation_operations = self.lifecycle_operations.lock().await;
              if creation_operations.shutting_down {
                  let _ = std::fs::remove_dir_all(&runner.config.work_dir);
                  bail!("Daemon shutdown is in progress");
              }

              let _persistence_guard''',
          )

          sub_once(
              r"        if let Some\(operations\) = creation_operations\.as_mut\(\) \{.*?        drop\(creation_operations\);",
              '''        if desired && !creation_operations.starting.insert(id.clone()) {
                  self.runners.write().await.remove(&id);
                  let _ = std::fs::remove_dir_all(&runner.config.work_dir);
                  bail!("Runner '{id}' already has a start operation in progress");
              }
              drop(creation_operations);''',
          )

          sub_once(
              r"    /// Wait until every start admitted before the shutdown barrier has.*?    pub\(crate\) async fn begin_stop_operation",
              '''    /// Wait for all lifecycle mutations admitted before the shutdown barrier.
              /// New mutations cannot appear after `begin_shutdown_operation`.
              pub(crate) async fn wait_for_lifecycle_operations_to_finish(&self) {
                  loop {
                      let operations = self.lifecycle_operations.lock().await;
                      let pending = operations.starting.len()
                          + operations.stopping.len()
                          + operations.updating.len()
                          + operations.deleting.len();
                      drop(operations);
                      if pending == 0 {
                          break;
                      }
                      tokio::time::sleep(std::time::Duration::from_millis(50)).await;
                  }
              }

              pub(crate) async fn begin_stop_operation''',
          )

          for signature in [
              r"pub\(crate\) async fn begin_stop_operation\(&self, id: &str\) -> Result<\(\)>",
              r"async fn begin_update_operation\(&self, id: &str\) -> Result<\(\)>",
              r"async fn begin_delete_operation\(&self, id: &str\) -> Result<\(\)>",
          ]:
              pattern = rf"(    {signature} \{{\n        let mut operations = self\.lifecycle_operations\.lock\(\)\.await;\n)"
              replacement = r'''\1        if operations.shutting_down {
                  bail!("Daemon shutdown is in progress");
              }
          '''
              updated, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"Expected one lifecycle admission match, found {count}: {signature}")
              text = updated

          text = text.replace(
              "wait_for_start_operations_to_finish",
              "wait_for_lifecycle_operations_to_finish",
          )

          marker = '''    #[tokio::test]
              async fn test_shutdown_waits_for_previously_admitted_start() {
          '''
          if text.count(marker) != 1:
              raise SystemExit("shutdown wait test marker missing or duplicated")
          extra_test = '''    #[tokio::test]
              async fn test_shutdown_barrier_rejects_other_mutations() {
                  let manager = create_test_manager();
                  let runner = manager
                      .create("owner/repo", None, None, None, None, None)
                      .await
                      .unwrap();
                  let id = runner.config.id;

                  manager.begin_shutdown_operation().await.unwrap();
                  assert!(manager.begin_stop_operation(&id).await.is_err());
                  assert!(manager.begin_update_operation(&id).await.is_err());
                  assert!(manager.begin_delete_operation(&id).await.is_err());
                  assert!(manager
                      .create("owner/repo", None, None, None, None, None)
                      .await
                      .is_err());
              }

          '''
          text = text.replace(marker, extra_test + marker, 1)
          path.write_text(text)

      - name: Format Rust changes
        run: cargo fmt --all
      - name: Commit hardening and remove workflow
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-shutdown-barrier-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: drain lifecycle mutations before shutdown"
          git push origin HEAD:fix/shutdown-lifecycle-barrier-2026-08-28
