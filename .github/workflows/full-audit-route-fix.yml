name: Full Audit Logout Route Fix

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'audit/full-product-function-screen-audit-2026-07-25'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/full-product-function-screen-audit-2026-07-25
      - name: Correct logout route without touching surrounding client code
        run: |
          if ! grep -q 'self.request("POST", "/auth/logout", None)' crates/tui/src/client.rs; then
            echo 'Logout route is already correct.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/tui/src/client.rs')
          source = path.read_text()
          old = 'self.request("POST", "/auth/logout", None)'
          new = 'self.request("DELETE", "/auth", None)'
          if source.count(old) != 1:
              raise SystemExit('unexpected logout route match count')
          path.write_text(source.replace(old, new, 1))
          PY
          cargo fmt --all -- --check
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/tui/src/client.rs
          git commit -m 'fix: use daemon logout route from CLI'
          git push origin HEAD:audit/full-product-function-screen-audit-2026-07-25
