name: Delete Integrity Prettier Fix

on:
  pull_request:
    branches: [master]
    types: [reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.number == 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/delete-integrity-and-start-admission-2026-07-24
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format changed frontend files
        working-directory: apps/desktop
        run: npx --yes prettier@3.9.5 --write package.json scripts/prepare-sidecar.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Formatting already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/package.json apps/desktop/scripts/prepare-sidecar.mjs
          git commit -m "style: format portable sidecar preparation"
          git push origin HEAD:audit/delete-integrity-and-start-admission-2026-07-24
