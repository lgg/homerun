name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Install Rust toolchain
        if: ${{ steps.release.outputs.pr }}
        uses: dtolnay/rust-toolchain@stable

      # When release-please creates or updates a PR, regenerate Cargo.lock files
      # so they remain synchronized with the version bump in Cargo.toml.
      - uses: actions/checkout@v6
        if: ${{ steps.release.outputs.pr }}
        with:
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Regenerate Cargo.lock files
        if: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Commit updated Cargo.lock files
        if: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock apps/desktop/src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Cargo.lock files for version bump"
            git push
          fi
