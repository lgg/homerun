name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: homerun-ci-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  release-please:
    runs-on: homerun-ci
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Verify release toolchain
        if: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          for tool in git rustc cargo; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "::error::$tool is not installed on the homerun-ci runner"
              exit 1
            }
          done

      # When release-please creates or updates a PR, regenerate Cargo.lock files
      # so they remain synchronized with the version bump in Cargo.toml.
      - uses: actions/checkout@v6
        if: ${{ steps.release.outputs.pr }}
        with:
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Regenerate Cargo.lock files
        if: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Commit updated Cargo.lock files
        if: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock apps/desktop/src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Cargo.lock files for version bump"
            git push
          fi
