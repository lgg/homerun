name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      # When release-please creates or updates a PR, check out that branch so
      # all generated lockfiles stay synchronized with the version bumps.
      - uses: actions/checkout@v6
        if: ${{ steps.release.outputs.pr }}
        with:
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Install Rust toolchain
        if: ${{ steps.release.outputs.pr }}
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        if: ${{ steps.release.outputs.pr }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Regenerate Cargo.lock files
        if: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Regenerate package-lock.json
        if: ${{ steps.release.outputs.pr }}
        working-directory: apps/desktop
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit updated lockfiles
        if: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock apps/desktop/src-tauri/Cargo.lock apps/desktop/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update lockfiles for version bump"
            git push
          fi
