name: Agent fetch validator failure log

on:
  push:
    branches:
      - agent/inspect-release-prep-run

permissions:
  contents: write
  actions: read

jobs:
  fetch-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/inspect-release-prep-run
      - name: Download validator log tail
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: "88059703481"
        run: |
          curl -fsSL -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            -o validator.log
          tail -n 80 validator.log > .validator-tail.txt
      - name: Commit log and remove workflow
        run: |
          git rm .github/workflows/agent-fetch-validator-log.yml
          git add .validator-tail.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: record validator failure log"
          git push origin HEAD:agent/inspect-release-prep-run
