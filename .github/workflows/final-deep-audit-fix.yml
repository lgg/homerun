name: Final Deep Audit Fix

on:
  push:
    branches: [agent/final-deep-audit-2026-07-24]

permissions:
  contents: write

jobs:
  prepare:
    if: "${{ github.event.head_commit.message == 'chore: run final deep audit' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/final-deep-audit-2026-07-24
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply reviewed corrections
        run: python .github/scripts/apply-final-deep-audit.py

      - name: Format Rust source
        run: cargo fmt --all

      - name: Commit staged audit result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml .github/workflows/coverage-badge.yml .github/workflows/release-please.yml crates/daemon/src/runner/mod.rs
          git diff --cached --check
          git commit -m "fix: close final lifecycle and workflow audit gaps"
          git push origin HEAD:agent/final-deep-audit-2026-07-24

  validate-linux:
    needs: prepare
    if: "${{ needs.prepare.result == 'success' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/final-deep-audit-2026-07-24

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Run frontend tests
        working-directory: apps/desktop
        run: npm test

      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --workspace --all-targets

      - name: Run Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check Linux Tauri application
        run: |
          cargo build --release -p homerund
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/homerund apps/desktop/src-tauri/binaries/homerund-x86_64-unknown-linux-gnu
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  validate-windows:
    needs: prepare
    if: "${{ needs.prepare.result == 'success' }}"
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/final-deep-audit-2026-07-24

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Run frontend tests
        working-directory: apps/desktop
        run: npm test

      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --workspace --all-targets

      - name: Run Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check Windows Tauri application
        shell: pwsh
        run: |
          cargo build --release -p homerund
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/binaries
          Copy-Item target/release/homerund.exe apps/desktop/src-tauri/binaries/homerund-x86_64-pc-windows-msvc.exe
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  finalize:
    needs: [validate-linux, validate-windows]
    if: "${{ always() && needs.validate-linux.result == 'success' && needs.validate-windows.result == 'success' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/final-deep-audit-2026-07-24
          fetch-depth: 0

      - name: Remove temporary audit machinery
        run: |
          set -euo pipefail
          rm .github/scripts/apply-final-deep-audit.py
          rm .github/workflows/final-deep-audit-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove temporary final audit workflow"
          git push origin HEAD:agent/final-deep-audit-2026-07-24
