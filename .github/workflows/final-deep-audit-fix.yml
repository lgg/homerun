name: Final Deep Audit Diagnostics

on:
  pull_request:
    branches: [master]
    types: [reopened]

permissions:
  contents: read

jobs:
  diagnose-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/final-deep-audit-2026-07-24

      - uses: dtolnay/rust-toolchain@stable

      - name: Test utilities all targets
        continue-on-error: true
        run: cargo test -p test-utils --all-targets

      - name: Workspace single-threaded
        continue-on-error: true
        run: cargo test --workspace --all-targets -- --test-threads=1

      - name: Capture exact workspace failure
        shell: bash
        run: |
          set +e
          cargo test --workspace --all-targets --quiet > workspace-test.log 2>&1
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            echo "===== failure markers ====="
            grep -nE 'FAILED|failures:|panicked at|error: test failed|thread .* panicked' workspace-test.log || true
            echo "===== final 240 lines ====="
            tail -n 240 workspace-test.log
            exit "$status"
          fi
          echo "Workspace tests passed"
