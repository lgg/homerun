name: Final Deep Audit Diagnostics

on:
  pull_request:
    branches: [master]
    types: [reopened]

permissions:
  contents: read

jobs:
  diagnose-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/final-deep-audit-2026-07-24

      - uses: dtolnay/rust-toolchain@stable

      - name: Native names across repositories
        continue-on-error: true
        run: cargo test -p homerund test_same_native_runner_name_is_allowed_across_repositories -- --nocapture

      - name: Container name collision
        continue-on-error: true
        run: cargo test -p homerund test_same_container_runner_name_is_rejected_across_repositories -- --nocapture

      - name: Delete reservation blocks start
        continue-on-error: true
        run: cargo test -p homerund test_delete_reservation_blocks_new_start_operations -- --nocapture

      - name: Update reservation arbitration
        continue-on-error: true
        run: cargo test -p homerund test_update_reservation_blocks_start_and_delete_waits_for_update -- --nocapture

      - name: Delete clears restored intent
        continue-on-error: true
        run: cargo test -p homerund test_delete_clears_intent_restored_by_inflight_start -- --nocapture

      - name: Daemon library suite
        continue-on-error: true
        run: cargo test -p homerund --lib

      - name: Daemon all targets
        continue-on-error: true
        run: cargo test -p homerund --all-targets

      - name: TUI all targets
        continue-on-error: true
        run: cargo test -p homerun --all-targets

      - name: Workspace all targets
        run: cargo test --workspace --all-targets
