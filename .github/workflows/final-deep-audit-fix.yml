name: Final Deep Audit Failure Capture

on:
  pull_request:
    branches: [master]
    types: [reopened]

permissions:
  contents: read

jobs:
  capture-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/final-deep-audit-2026-07-24

      - uses: dtolnay/rust-toolchain@stable

      - name: Capture exact parallel workspace failure
        shell: bash
        run: |
          set +e
          cargo test --workspace --all-targets --quiet > workspace-test.log 2>&1
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            grep -nE 'FAILED|failures:|panicked at|error: test failed|thread .* panicked' workspace-test.log || true
            tail -n 160 workspace-test.log
            exit "$status"
          fi
          echo "Workspace tests passed"
