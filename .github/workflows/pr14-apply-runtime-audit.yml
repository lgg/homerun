name: PR14 Apply Runtime Audit

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'audit/post-merge-runtime-consistency-2026-07-31'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/post-merge-runtime-consistency-2026-07-31
          fetch-depth: 0

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Apply audited fixes
        run: |
          python scripts/pr14_backend_patch.py
          python scripts/pr14_frontend_patch.py
          # Workflow files require a separate GitHub App permission. Keep the
          # runtime consistency commit limited to production code/docs/tests.
          git checkout -- .github/workflows/release-build.yml

      - name: Format changed files
        run: |
          cargo fmt --all
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
          npx --yes prettier@3.9.5 --write \
            README.md \
            apps/desktop/src/hooks/AuthContext.tsx \
            apps/desktop/src/hooks/useRunners.ts \
            apps/desktop/src/hooks/useRepos.ts \
            apps/desktop/src/hooks/useMetrics.ts \
            apps/desktop/src/hooks/useDaemonLogs.ts \
            apps/desktop/src/hooks/useScan.ts \
            apps/desktop/src/hooks/useJobSteps.ts \
            apps/desktop/src/hooks/useJobHistory.ts \
            apps/desktop/src/pages/Repositories.tsx \
            apps/desktop/src/pages/MiniView.tsx \
            apps/desktop/src/pages/RunnerDetail.tsx \
            apps/desktop/src/pages/Settings.tsx
          git diff --check

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Frontend quality gate
        working-directory: apps/desktop
        run: |
          npm test
          npm exec -- tsc --noEmit
          npm run build

      - name: Rust quality gate
        env:
          HOMERUN_SKIP_KEYCHAIN: "1"
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          npm --prefix apps/desktop run prepare-sidecar
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets

      - name: Commit verified production changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            README.md \
            crates/daemon/src \
            apps/desktop/src-tauri/src/commands.rs \
            apps/desktop/src
          if git diff --cached --quiet; then
            echo 'No production changes to commit.'
            exit 0
          fi
          git commit -m 'fix: harden runtime state and persistence consistency'
          git push origin HEAD:audit/post-merge-runtime-consistency-2026-07-31
