name: Post-merge Publish Import Diagnostic

on:
  pull_request:
    branches: [master]
    types: [reopened]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.head_ref == 'audit/post-merge-transactional-lifecycle-2026-07-24' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/post-merge-transactional-lifecycle-2026-07-24
          fetch-depth: 0

      - name: Apply and publish with diagnostics
        id: publish
        shell: bash
        run: |
          set +e
          {
            python - <<'PY'
          from pathlib import Path
          path = Path('crates/daemon/src/api/groups.rs')
          text = path.read_text(encoding='utf-8')
          old = '''#[cfg(test)]
          mod tests {
              use crate::server::{create_router, AppState};
          '''
          new = '''#[cfg(test)]
          mod tests {
              use crate::runner::state::RunnerState;
              use crate::server::{create_router, AppState};
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one tests import block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/daemon/src/api/groups.rs
            git diff --cached --check
            git diff --cached --stat
            git commit -m "test: import runner state in group lifecycle regression"
            git fetch origin audit/post-merge-transactional-lifecycle-2026-07-24
            git rebase origin/audit/post-merge-transactional-lifecycle-2026-07-24
            git push origin HEAD:audit/post-merge-transactional-lifecycle-2026-07-24
          } > publish-import.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          set -e

      - uses: actions/upload-artifact@v4
        with:
          name: publish-import-report
          path: publish-import.log
          retention-days: 1

      - name: Fail unsuccessful publication
        if: ${{ steps.publish.outputs.status != '0' }}
        run: exit "${{ steps.publish.outputs.status }}"

  report:
    needs: publish
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: publish-import-report
      - run: cat publish-import.log
