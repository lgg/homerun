name: One-shot test runner startup isolation

on:
  push:
    branches: [test/hermetic-delete-endpoint-2026-08-28]
    paths:
      - .github/workflows/one-shot-test-start-isolation.yml

permissions:
  contents: write

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply test-only startup isolation
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/daemon/src/runner/mod.rs')
          text = path.read_text()
          anchor = '''    async fn do_register_and_start(&self, id: &str, auth_token: &str) -> Result<()> {\n        self.set_auth_token(Some(auth_token.to_string())).await;\n\n        let runner = self\n'''
          replacement = '''    async fn do_register_and_start(&self, id: &str, auth_token: &str) -> Result<()> {\n        self.set_auth_token(Some(auth_token.to_string())).await;\n\n        // API unit tests use a dedicated sentinel token. Do not let their\n        // background auto-start tasks download/configure a real GitHub Actions\n        // runner: parallel tests would otherwise contend on the process-wide\n        // runner download lock and keep lifecycle reservations for up to a minute.\n        // This branch is compiled only in tests and cannot affect production.\n        #[cfg(test)]\n        if auth_token == "ghp_test_token" {\n            self.update_state_with_error(\n                id,\n                RunnerState::Error,\n                Some("Runner startup skipped for test authentication".to_string()),\n            )\n            .await?;\n            self.emit_state_event(id, "error");\n            return Ok(());\n        }\n\n        let runner = self\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one do_register_and_start anchor, found {text.count(anchor)}')
          text = text.replace(anchor, replacement, 1)

          test_anchor = '''    #[tokio::test]\n    async fn test_shutdown_barrier_rejects_new_starts() {\n'''
          regression = '''    #[tokio::test]\n    async fn test_test_auth_start_skips_external_runner_setup() {\n        let manager = create_test_manager();\n        let runner = manager\n            .create("owner/repo", None, None, None, None, None)\n            .await\n            .unwrap();\n        let id = runner.config.id;\n\n        manager\n            .register_and_start(&id, "ghp_test_token")\n            .await\n            .unwrap();\n\n        let runner = manager.get(&id).await.unwrap();\n        assert_eq!(runner.state, RunnerState::Error);\n        assert!(!manager.has_active_process(&id).await);\n        assert!(runner\n            .error_message\n            .as_deref()\n            .unwrap_or_default()\n            .contains("skipped for test authentication"));\n    }\n\n'''
          if text.count(test_anchor) != 1:
              raise SystemExit(f'expected one shutdown test anchor, found {text.count(test_anchor)}')
          text = text.replace(test_anchor, regression + test_anchor, 1)
          path.write_text(text)
      - name: Format
        run: cargo fmt --all -- --check
      - name: Run startup isolation regression
        run: cargo test --locked -p homerund runner::tests::test_test_auth_start_skips_external_runner_setup -- --exact
      - name: Run delete endpoint regression
        run: cargo test --locked -p homerund api::runners::tests::test_delete_runner -- --exact
      - name: Run group delete regression
        run: cargo test --locked -p homerund api::groups::tests::test_group_delete_removes_runners -- --exact
      - name: Run scale-down regression
        run: cargo test --locked -p homerund api::groups::tests::test_scale_down_removes_runners -- --exact
      - name: Upload patched file
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v6
        with:
          name: patched-runner-mod
          path: crates/daemon/src/runner/mod.rs

  commit:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: patched-runner-mod
          path: /tmp/patched
      - name: Commit validated patch and remove one-shot workflow
        run: |
          cp /tmp/patched/mod.rs crates/daemon/src/runner/mod.rs
          rm .github/workflows/one-shot-test-start-isolation.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: isolate API runner startup from external setup"
          git push origin HEAD:test/hermetic-delete-endpoint-2026-08-28
