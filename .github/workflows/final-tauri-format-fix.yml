name: Format full Tauri audit surface

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  format-tauri:
    if: >-
      github.event.pull_request.number == 20 &&
      github.head_ref == 'audit/final-declared-surfaces-2026-08-01' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/final-declared-surfaces-2026-08-01
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format the complete Tauri crate
        run: |
          test -e .github/audit/final-tauri-format.trigger
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
          rm .github/audit/final-tauri-format.trigger
          git diff --check
      - name: Commit complete Tauri formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/desktop/src-tauri/build.rs apps/desktop/src-tauri/src
          git add -u .github/audit/final-tauri-format.trigger
          git commit -m "style: format complete Tauri crate"
          git push origin HEAD:audit/final-declared-surfaces-2026-08-01
