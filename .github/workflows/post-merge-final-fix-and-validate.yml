name: Post-merge Final Fix and Validate

on:
  pull_request:
    branches: [master]
    types: [reopened]

permissions:
  contents: write

jobs:
  prepare-final-fix:
    if: ${{ github.head_ref == 'audit/post-merge-transactional-lifecycle-2026-07-24' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/post-merge-transactional-lifecycle-2026-07-24
          fetch-depth: 0

      - name: Add missing regression-test import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/daemon/src/api/groups.rs')
          text = path.read_text(encoding='utf-8')
          old = '''#[cfg(test)]
          mod tests {
              use crate::server::{create_router, AppState};
          '''
          new = '''#[cfg(test)]
          mod tests {
              use crate::runner::state::RunnerState;
              use crate::server::{create_router, AppState};
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one tests import block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all

      - name: Commit final test fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/daemon/src/api/groups.rs
          git diff --cached --check
          git commit -m "test: import runner state in group lifecycle regression"
          git push origin HEAD:audit/post-merge-transactional-lifecycle-2026-07-24

  validate-linux-final:
    needs: prepare-final-fix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/post-merge-transactional-lifecycle-2026-07-24
      - name: Verify unsafe helper was fully removed
        run: |
          if grep -R "register_and_start_from_registering" crates --include='*.rs'; then
            exit 1
          fi
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - working-directory: apps/desktop
        run: npm ci
      - working-directory: apps/desktop
        run: npm test
      - working-directory: apps/desktop
        run: npm exec -- tsc --noEmit
      - working-directory: apps/desktop
        run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Linux Tauri check
        run: |
          cargo build --release -p homerund
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/homerund apps/desktop/src-tauri/binaries/homerund-x86_64-unknown-linux-gnu
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  validate-windows-final:
    needs: prepare-final-fix
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/post-merge-transactional-lifecycle-2026-07-24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - working-directory: apps/desktop
        run: npm ci
      - working-directory: apps/desktop
        run: npm test
      - working-directory: apps/desktop
        run: npm exec -- tsc --noEmit
      - working-directory: apps/desktop
        run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Windows Tauri check
        shell: pwsh
        run: |
          cargo build --release -p homerund
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/binaries
          Copy-Item target/release/homerund.exe apps/desktop/src-tauri/binaries/homerund-x86_64-pc-windows-msvc.exe
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
