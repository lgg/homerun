name: Post-merge Follow-up

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  ubuntu-verify:
    if: github.head_ref == 'audit/post-merge-followup-2026-07-31'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Verify clean source tree
        run: |
          git diff --check
          cargo fmt --all -- --check
          test -z "$(git ls-files apps/desktop/coverage)"
          test ! -e .github/audit/apply_followup.py
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Verify frontend
        working-directory: apps/desktop
        run: |
          npm run test:coverage
          npm exec -- tsc --noEmit
          npm run build
      - name: Verify Rust workspace
        run: |
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo build --release -p homerun -p homerund
          ./target/release/homerun --help

  windows-verify:
    if: github.head_ref == 'audit/post-merge-followup-2026-07-31'
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify Windows Rust workspace
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo build --release -p homerun -p homerund
          .\target\release\homerun.exe --help
