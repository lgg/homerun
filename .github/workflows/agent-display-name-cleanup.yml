name: Agent display-name cleanup

on:
  push:
    branches:
      - agent/display-name-renaming

permissions:
  contents: write

jobs:
  clean-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/display-name-renaming
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Clean feature diff
        run: python .github/scripts/cleanup_display_name_pr.py

      - name: Test daemon and TUI workspace
        run: cargo test --workspace

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Test desktop frontend
        working-directory: apps/desktop
        run: npm test

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Check Tauri bridge
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Remove temporary cleanup files
        run: |
          rm .github/scripts/cleanup_display_name_pr.py
          rm .github/workflows/agent-display-name-cleanup.yml

      - name: Commit cleaned implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: clean display name feature diff"
          git push origin HEAD:agent/display-name-renaming
