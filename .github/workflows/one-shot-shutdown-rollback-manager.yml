name: One-shot shutdown rollback manager

on:
  push:
    branches:
      - fix/shutdown-stop-failure-rollback-2026-08-28
    paths:
      - .github/workflows/one-shot-shutdown-rollback-manager.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/shutdown-stop-failure-rollback-2026-08-28
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Add shutdown barrier rollback
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/daemon/src/runner/mod.rs")
          text = path.read_text()

          method_marker = '''    /// Wait for all lifecycle mutations admitted before the shutdown barrier.
              /// New mutations cannot appear after `begin_shutdown_operation`.
          '''
          method = '''    /// Re-open lifecycle admission when shutdown cannot complete. Callers must
              /// first drain operations admitted before the barrier so reopening cannot
              /// overlap an older mutation that shutdown had already accepted.
              pub(crate) async fn cancel_shutdown_operation(&self) {
                  self.lifecycle_operations.lock().await.shutting_down = false;
              }

          ''' + method_marker
          if text.count(method_marker) != 1:
              raise SystemExit(f"Expected one shutdown wait marker, found {text.count(method_marker)}")
          text = text.replace(method_marker, method, 1)

          test_marker = '''    #[tokio::test]
              async fn test_shutdown_barrier_rejects_new_starts() {
          '''
          test = '''    #[tokio::test]
              async fn test_cancel_shutdown_reopens_lifecycle_admission() {
                  let manager = create_test_manager();
                  let runner = manager
                      .create("owner/repo", None, None, None, None, None)
                      .await
                      .unwrap();

                  assert_eq!(manager.begin_shutdown_operation().await.unwrap(), 0);
                  assert!(manager
                      .begin_start_operation(&runner.config.id)
                      .await
                      .is_err());

                  manager.cancel_shutdown_operation().await;
                  manager
                      .begin_start_operation(&runner.config.id)
                      .await
                      .unwrap();
                  manager.finish_start_operation(&runner.config.id).await;

                  // A later shutdown can install a fresh barrier normally.
                  assert_eq!(manager.begin_shutdown_operation().await.unwrap(), 0);
              }

          ''' + test_marker
          if text.count(test_marker) != 1:
              raise SystemExit(f"Expected one shutdown test marker, found {text.count(test_marker)}")
          text = text.replace(test_marker, test, 1)

          path.write_text(text)
      - name: Format Rust changes
        run: cargo fmt --all
      - name: Commit manager change and remove workflow
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-shutdown-rollback-manager.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: allow failed shutdown to reopen lifecycle"
          git push origin HEAD:fix/shutdown-stop-failure-rollback-2026-08-28
