name: Final declared-surfaces verification

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  ubuntu-verify:
    if: >-
      github.event.pull_request.number == 20 &&
      github.head_ref == 'audit/final-declared-surfaces-2026-08-01' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Check patch whitespace
        run: git diff --check
      - name: Check workspace formatting
        run: cargo fmt --all -- --check
      - name: Check Tauri formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - name: Check repository hygiene
        run: |
          test -z "$(git ls-files apps/desktop/coverage)"
          test ! -e .github/audit
          test ! -e .github/pr20-tauri-diagnostic-trigger
          test ! -e .github/workflows/apply-job-context-generation-fix.yml
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: apps/desktop
        run: npm audit --audit-level=high
      - name: Test frontend with coverage
        working-directory: apps/desktop
        run: npm run test:coverage
      - name: Type-check frontend
        working-directory: apps/desktop
        run: npm exec -- tsc --noEmit
      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build
      - name: Test core Rust workspace
        run: cargo test --workspace --all-targets
      - name: Lint core Rust workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build release binaries
        run: cargo build --release -p homerun -p homerund
      - name: Smoke-test CLI
        run: ./target/release/homerun --help
      - name: Prepare Tauri sidecar
        working-directory: apps/desktop
        run: npm run prepare-sidecar
      - name: Test Tauri crate
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
      - name: Lint Tauri crate
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

  windows-verify:
    if: >-
      github.event.pull_request.number == 20 &&
      github.head_ref == 'audit/final-declared-surfaces-2026-08-01' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check workspace formatting
        run: cargo fmt --all -- --check
      - name: Check Tauri formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - name: Test core Rust workspace
        run: cargo test --workspace --all-targets
      - name: Lint core Rust workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build release binaries
        run: cargo build --release -p homerun -p homerund
      - name: Smoke-test CLI
        shell: pwsh
        run: .\target\release\homerun.exe --help
      - name: Prepare Tauri sidecar
        working-directory: apps/desktop
        run: npm run prepare-sidecar
      - name: Test Tauri crate
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
      - name: Lint Tauri crate
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
