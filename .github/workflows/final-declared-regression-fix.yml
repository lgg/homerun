name: Apply final audit regression fix

on:
  pull_request:
    branches: [master]
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.repository == 'lgg/homerun' &&
      github.head_ref == 'audit/final-declared-surfaces-2026-08-01' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/final-declared-surfaces-2026-08-01
          fetch-depth: 0
      - name: Apply brace fix
        run: python3 .github/audit/apply_final_declared_surfaces.py
      - name: Commit corrected product files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/audit/apply_final_declared_surfaces.py
          git add apps/desktop/src-tauri/src/commands.rs crates/tui/src/daemon_lifecycle.rs
          git diff --cached --check
          git commit -m "fix: correct audit regression placement [skip ci]"
          git push origin HEAD:audit/final-declared-surfaces-2026-08-01
