name: Post-merge Transaction Audit Default

on:
  pull_request:
    branches: [master]
    types: [reopened]

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.head_ref == 'audit/post-merge-transactional-lifecycle-2026-07-24' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/post-merge-transactional-lifecycle-2026-07-24
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply audited corrections
        run: python .github/scripts/apply-post-merge-transaction-audit.py

      - name: Format Rust source
        run: cargo fmt --all

      - name: Commit audited source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/daemon/src/runner/mod.rs crates/daemon/src/api/runners.rs
          git diff --cached --check
          git commit -m "fix: make runner lifecycle persistence transactional"
          git push origin HEAD:audit/post-merge-transactional-lifecycle-2026-07-24

  validate-linux:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/post-merge-transactional-lifecycle-2026-07-24

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Frontend tests
        working-directory: apps/desktop
        run: npm test

      - name: Frontend typecheck
        working-directory: apps/desktop
        run: npm exec -- tsc --noEmit

      - name: Frontend build
        working-directory: apps/desktop
        run: npm run build

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust tests
        run: cargo test --workspace --all-targets

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Linux Tauri check
        run: |
          cargo build --release -p homerund
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/homerund apps/desktop/src-tauri/binaries/homerund-x86_64-unknown-linux-gnu
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  validate-windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/post-merge-transactional-lifecycle-2026-07-24

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Frontend tests
        working-directory: apps/desktop
        run: npm test

      - name: Frontend typecheck
        working-directory: apps/desktop
        run: npm exec -- tsc --noEmit

      - name: Frontend build
        working-directory: apps/desktop
        run: npm run build

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust tests
        run: cargo test --workspace --all-targets

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Windows Tauri check
        shell: pwsh
        run: |
          cargo build --release -p homerund
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/binaries
          Copy-Item target/release/homerund.exe apps/desktop/src-tauri/binaries/homerund-x86_64-pc-windows-msvc.exe
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
