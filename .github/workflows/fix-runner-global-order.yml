name: Fix global runner ordering

on:
  push:
    branches:
      - fix/runtime-home-runner-display-preferences

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply global ordering fix
        run: python3 .github/fix_runner_global_order.py
      - name: Format frontend
        working-directory: apps/desktop
        run: npx --yes prettier@3 --write src/components/RunnerTable.tsx
      - name: Remove one-shot files
        run: rm .github/fix_runner_global_order.py .github/workflows/fix-runner-global-order.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: globally order runner groups by activity"
          git push origin HEAD:${GITHUB_REF_NAME}
