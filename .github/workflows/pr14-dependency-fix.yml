name: PR14 Dependency Security Fix

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.head_ref == 'audit/post-merge-runtime-consistency-2026-07-31'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/post-merge-runtime-consistency-2026-07-31
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Migrate to patched router and toolchain
        working-directory: apps/desktop
        shell: bash
        run: |
          npm uninstall react-router-dom
          npm install react-router@^8.3.0
          npm install --save-dev \
            vite@^6.4.3 \
            jsdom@^29.1.1 \
            @vitest/coverage-v8@^4.1.10 \
            vitest@^4.1.10
          npm audit fix
          python - <<'PY'
          from pathlib import Path

          root = Path('src')
          changed = 0
          for path in root.rglob('*'):
              if path.suffix not in {'.ts', '.tsx'}:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text.replace('"react-router-dom"', '"react-router"')
              updated = updated.replace("'react-router-dom'", "'react-router'")
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed += 1
          if changed == 0:
              raise SystemExit('No react-router-dom imports were found')
          print(f'Updated {changed} source files')
          PY

      - name: Verify dependency audits
        working-directory: apps/desktop
        run: |
          npm audit --omit=dev --audit-level=low
          npm audit --audit-level=low

      - name: Verify frontend
        working-directory: apps/desktop
        run: |
          npx prettier@3.9.5 --write package.json src
          npm test
          npm exec -- tsc --noEmit
          npm run build
          git diff --check

      - name: Commit verified dependency fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/package.json apps/desktop/package-lock.json apps/desktop/src
          if git diff --cached --quiet; then
            echo 'No dependency changes to commit.'
            exit 0
          fi
          git commit -m 'fix: update vulnerable desktop dependencies'
          git push origin HEAD:audit/post-merge-runtime-consistency-2026-07-31
