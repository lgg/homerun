name: Delete Integrity Clean Validation

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  linux:
    if: github.event.pull_request.number == 12
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/delete-integrity-and-start-admission-2026-07-24
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Prettier check
        working-directory: apps/desktop
        run: npx --yes prettier@3.9.5 --check package.json scripts/prepare-sidecar.mjs
      - name: Frontend tests
        working-directory: apps/desktop
        run: npm test
      - name: Type check
        working-directory: apps/desktop
        run: npm exec -- tsc --noEmit
      - name: Frontend production build
        working-directory: apps/desktop
        run: npm run build
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust workspace tests
        run: cargo test --workspace --all-targets
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Release daemon build
        run: cargo build -p homerund --release
      - name: Prepare Tauri sidecar
        working-directory: apps/desktop
        run: npm run prepare-sidecar
      - name: Linux Tauri check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets

  windows:
    if: github.event.pull_request.number == 12
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/delete-integrity-and-start-admission-2026-07-24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Frontend tests
        working-directory: apps/desktop
        run: npm test
      - name: Type check
        working-directory: apps/desktop
        run: npm exec -- tsc --noEmit
      - name: Frontend production build
        working-directory: apps/desktop
        run: npm run build
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust workspace tests
        run: cargo test --workspace --all-targets
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Release daemon build
        run: cargo build -p homerund --release
      - name: Prepare Tauri sidecar
        working-directory: apps/desktop
        run: npm run prepare-sidecar
      - name: Windows Tauri check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
