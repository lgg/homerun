name: Correct final scanner regression

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.event.pull_request.number == 20 &&
      github.head_ref == 'audit/final-declared-surfaces-2026-08-01' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/final-declared-surfaces-2026-08-01
          fetch-depth: 0
      - name: Correct helper reference
        run: |
          test -e .github/audit/final-scanner-test.trigger
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/daemon/src/scanner/mod.rs')
          text = path.read_text(encoding='utf-8')
          old = '''        write_workflow(
              &fake_repo,
              "ci.yml",
              "jobs:\\n  build:\\n    runs-on: self-hosted\\n",
          );'''
          new = '''        create_workflow(
              &fake_repo,
              "ci.yml",
              "jobs:\\n  build:\\n    runs-on: self-hosted\\n",
          );'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one helper reference, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/audit/final-scanner-test.trigger
          cargo fmt --all
          git diff --check
      - name: Commit correction only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/daemon/src/scanner/mod.rs
          git add -u .github/audit/final-scanner-test.trigger
          git commit -m "test: correct scanner regression helper"
          git push origin HEAD:audit/final-declared-surfaces-2026-08-01
